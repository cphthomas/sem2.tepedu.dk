<body data-formål="Forståelse af fortrydelsesret, førtidig indfrielse og opgørelse af fordring." data-forudsætning-url="https://jura.tepedu.dk/kapitel5.html" data-forudsætning-text="Online-bog Jura Kapitel 5: Kreditaftale, Kaution & Gældsbreve" data-forudsætning="">

                                   <div>
                                        <h1>
                                             Jura: Kreditaftaleloven - Fortrydelsesret og førtidig indfrielse
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvor lang er fortrydelsesfristen ifølge KAL § 19?"
                                        data-answer="2"
                                        data-explanation="Forbrugeren har altid 14 dages fortrydelsesret på kreditaftaler. Fristen løber fra den dag, aftalen er indgået OG vilkårene er modtaget.">
                                        <div class="option" data-option="7 dage, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="30 dage, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="14 dage fra den dag, aftalen er indgået OG vilkårene er modtaget"></div>
                                        <div class="option" data-option="60 dage, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår starter fortrydelsesfristen ifølge KAL § 19?"
                                        data-answer="1"
                                        data-explanation="Fortrydelsesfristen starter fra den dag, aftalen er indgået OG vilkårene er modtaget. Hvis aftalen indgås først og vilkårene modtages senere, starter fristen fra den dag, vilkårene modtages.">
                                        <div class="option" data-option="Fra den dag, aftalen er indgået, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Fra den dag, aftalen er indgået OG vilkårene er modtaget"></div>
                                        <div class="option" data-option="Fra den dag, lånet udbetales, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Fra den dag, første ydelse forfalder, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal kunden gøre, hvis de vil fortryde lånet?"
                                        data-answer="0"
                                        data-explanation="Kunden skal give banken besked om fortrydelse inden for 14 dage. Derefter skal kunden betale lånebeløbet (plus påløbne renter) tilbage senest 30 dage efter fortrydelsen.">
                                        <div class="option"
                                             data-option="Give banken besked om fortrydelse og betale lånebeløbet (plus påløbne renter) tilbage senest 30 dage efter fortrydelsen"></div>
                                        <div class="option" data-option="Kun give banken besked hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun betale lånet tilbage, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ingenting - lånet er automatisk fortrydt, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis kunden fortryder lånet 10 dage efter indgåelse, hvad sker der?"
                                        data-answer="3"
                                        data-explanation="Kunden kan fortryde lånet inden for 14 dage. Kunden skal give banken besked og betale lånebeløbet (plus påløbne renter) tilbage senest 30 dage efter fortrydelsen.">
                                        <div class="option" data-option="Fortrydelsesretten er bortfaldet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kunden skal betale ekstra gebyr, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Lånet er automatisk ugyldigt, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Kunden kan fortryde - skal give besked og betale tilbage senest 30 dage efter fortrydelsen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis kunden forsøger at fortryde lånet 20 dage efter indgåelse, hvad sker der?"
                                        data-answer="2"
                                        data-explanation="Fortrydelsesretten er bortfaldet efter 14 dage. Kunden kan ikke længere fortryde lånet - det er bindende.">
                                        <div class="option" data-option="Kunden kan stadig fortryde, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kunden skal betale ekstra gebyr, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Fortrydelsesretten er bortfaldet - lånet er bindende"></div>
                                        <div class="option" data-option="Lånet er automatisk ugyldigt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forbrugerens ret ved førtidig indfrielse ifølge KAL § 26?"
                                        data-answer="1"
                                        data-explanation="Forbrugeren har altid ret til at betale sin gæld ud før tid. Banken kan kun kræve kompensation, hvis det er aftalt, og renten er fast. Ved variabel rente ingen kompensation.">
                                        <div class="option" data-option="Kun hvis banken tillader det, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Forbrugeren har altid ret til at betale gælden ud før tid. Ved fast rente kan banken kræve kompensation (hvis aftalt). Ved variabel rente ingen kompensation"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 1 mio. kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun hvis lånet er under 500.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår kan banken kræve kompensation ved førtidig indfrielse?"
                                        data-answer="0"
                                        data-explanation="Banken kan kun kræve kompensation ved fast rente, hvis det er aftalt i kontrakten. Ved variabel rente kan banken ikke kræve kompensation. Kompensationen beregnes som differencen mellem den oprindelige rente og markedsrenten.">
                                        <div class="option"
                                             data-option="Ved fast rente, hvis det er aftalt i kontrakten. Ved variabel rente ingen kompensation"></div>
                                        <div class="option" data-option="Altid, uanset rentetype hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun ved variabel rente, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 2 mio. kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal medregnes ved opgørelse af fordring ved førtidig indfrielse ifølge KAL § 27?"
                                        data-answer="3"
                                        data-explanation="Ved førtidig indfrielse skal kreditgiveren opgøre sit tilgodehavende med: Hovedstolen (den ubetalte del) og forfaldne renter. Fremtidige renter og fremtidige gebyrer skal fradrages.">
                                        <div class="option" data-option="Kun hovedstolen, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Hovedstolen og alle fremtidige renter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun renterne, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Hovedstolen og forfaldne renter. Fremtidige renter og fremtidige gebyrer skal fradrages"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal fradrages ved opgørelse af fordring ved førtidig indfrielse?"
                                        data-answer="2"
                                        data-explanation="Fremtidige renter og fremtidige gebyrer skal fradrages ved førtidig indfrielse. Kreditgiveren kan ikke kræve betaling af fremtidige renter eller gebyrer. Kun den faktiske gæld skal betales.">
                                        <div class="option" data-option="Kun hovedstolen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun forfaldne renter, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Fremtidige renter og fremtidige gebyrer"></div>
                                        <div class="option" data-option="Ingenting skal fradrages, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis kunde har fastforrentet realkreditlån på 2 mio. kr. til 4% i 30 år, og renten er faldet til 2% efter 5 år, hvad sker der ved førtidig indfrielse?"
                                        data-answer="1"
                                        data-explanation="Kunden kan betale lånet ud før tid. Banken kan kræve kompensation for rentetab (differencen mellem 4% og 2%). Kompensationen beregnes som nutidsværdien af rentetabet. Typisk 2-5% af restgælden.">
                                        <div class="option" data-option="Kunden kan ikke betale lånet ud, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Kunden kan betale lånet ud, men banken kan kræve kompensation for rentetab (typisk 2-5% af restgælden)"></div>
                                        <div class="option" data-option="Kunden skal betale hele lånet plus alle fremtidige renter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Ingen kompensation, da renten er faldet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis kunde har variabelt lån til 4% + CIBOR, hvad sker der ved førtidig indfrielse?"
                                        data-answer="0"
                                        data-explanation="Ved variabel rente kan kunden betale lånet ud når som helst uden kompensation. Banken lider ikke tab ved variabel rente, da renten justeres løbende. Ingen ekstra omkostninger ved førtidig indfrielse.">
                                        <div class="option"
                                             data-option="Kunden kan betale lånet ud når som helst uden kompensation - ingen ekstra omkostninger"></div>
                                        <div class="option" data-option="Kunden skal betale kompensation hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kunden kan ikke betale lånet ud, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hvis banken tillader det, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'forfaldne renter'?"
                                        data-answer="3"
                                        data-explanation="Forfaldne renter er renter af forfaldne ydelser (ydelser, der er forfaldne, men ikke betalt). Disse kan medregnes ved opgørelse. Fremtidige renter (af ydelser, der endnu ikke er forfaldne) skal fradrages.">
                                        <div class="option" data-option="Alle fremtidige renter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hovedstolen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun gebyrerne, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Renter af forfaldne ydelser (ydelser, der er forfaldne, men ikke betalt)"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem forfaldne renter og fremtidige renter?"
                                        data-answer="2"
                                        data-explanation="Forfaldne renter er renter af ydelser, der er forfaldne, men ikke betalt. Disse kan medregnes. Fremtidige renter er renter af ydelser, der endnu ikke er forfaldne. Disse skal fradrages ved førtidig indfrielse.">
                                        <div class="option" data-option="Der er ingen forskel og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Forfaldne renter skal fradrages, fremtidige renter kan medregnes"></div>
                                        <div class="option"
                                             data-option="Forfaldne renter kan medregnes, fremtidige renter skal fradrages"></div>
                                        <div class="option" data-option="Begge skal fradrages og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis kunde har lånt 500.000 kr. og har betalt 200.000 kr., hvad er hovedstolen ved førtidig indfrielse?"
                                        data-answer="1"
                                        data-explanation="Hovedstolen er den ubetalte del af kreditbeløbet. Hvis kunden har lånt 500.000 kr. og betalt 200.000 kr., er hovedstolen 300.000 kr. Fremtidige renter skal fradrages fra dette beløb.">
                                        <div class="option" data-option="500.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="300.000 kr. (den ubetalte del)"></div>
                                        <div class="option" data-option="200.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="700.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'forhalingsrente' ifølge KAL § 24?"
                                        data-answer="0"
                                        data-explanation="Forhalingsrente er en rente som følge af for sen betaling - i modsætning til almindelig kreditrente. Svarende til 'morarente'. Ved misligholdelse kan kreditgiveren kun kræve forhalingsrente, hvis dette er aftalt.">
                                        <div class="option"
                                             data-option="En rente som følge af for sen betaling - kan kun kræves ved misligholdelse, hvis aftalt"></div>
                                        <div class="option" data-option="Den normale kreditrente hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun renter ved førtidig indfrielse, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun gebyrer, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'opgørelse af fordring'?"
                                        data-answer="3"
                                        data-explanation="Opgørelse af fordring er reglerne om opgørelse af kreditgiverens tilgodehavende ved førtidig indfrielse eller misligholdelse. Ved førtidig indfrielse skal kreditgiveren opgøre tilgodehavende med fradrag for fremtidige renter og gebyrer.">
                                        <div class="option" data-option="Kun hovedstolen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun renterne, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun gebyrerne, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Reglerne om opgørelse af kreditgiverens tilgodehavende ved førtidig indfrielse eller misligholdelse"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis kunde har misligholdt 2 månedlige ydelser, hvad kan kreditgiveren kræve?"
                                        data-answer="2"
                                        data-explanation="Ved misligholdelse kan kreditgiveren kun kræve forfaldne ydelser. Renter af disse kan medregnes. Men fremtidige renter og fremtidige gebyrer skal fradrages. Kreditgiveren kan ikke kræve betaling af fremtidige ydelser.">
                                        <div class="option" data-option="Alle fremtidige ydelser, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hovedstolen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Forfaldne ydelser og renter af disse. Fremtidige renter og gebyrer skal fradrages"></div>
                                        <div class="option" data-option="Kun gebyrerne, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem fortrydelsesret og førtidig indfrielse?"
                                        data-answer="1"
                                        data-explanation="Fortrydelsesret er retten til at fortryde lånet inden for 14 dage efter indgåelse. Førtidig indfrielse er retten til at betale lånet ud før tid (efter fortrydelsesfristen). Begge er rettigheder for forbrugeren, men har forskellige frist og regler.">
                                        <div class="option" data-option="Der er ingen forskel - det er det samme, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Fortrydelsesret: Retten til at fortryde inden for 14 dage. Førtidig indfrielse: Retten til at betale lånet ud før tid (efter fortrydelsesfristen)"></div>
                                        <div class="option" data-option="Fortrydelsesret: Efter 14 dage. Førtidig indfrielse: Inden for 14 dage, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Kun fortrydelsesret er en rettighed, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
