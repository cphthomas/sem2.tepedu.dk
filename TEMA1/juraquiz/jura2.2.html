     <body data-formål="Forståelse af fuldmagtsreglerne i Aftaleloven, herunder stillingsfuldmagt, overskridelse af fuldmagt og tilbagekaldelse." data-forudsætning-url="https://jura.tepedu.dk/kapitel2.html" data-forudsætning-text="Aftaleloven - Kapitel 2" data-forudsætning="">

          <h2>Quiz Aftaleloven - Fuldmagt</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Aftaleloven: Fuldmagt
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er stillingsfuldmagt efter AFTL § 10, stk. 2?"
                                        data-answer="2"
                                        data-explanation="Efter AFTL § 10, stk. 2 gives der automatisk fuldmagt ved ansættelse i en stilling til sædvanlige handlinger. En 'Senior Erhvervsrådgiver' har automatisk fuldmagt til at bevilge lån inden for normale grænser. En kasserer har automatisk fuldmagt til at hæve penge.">
                                        <div class="option" data-option="En skriftlig fuldmagt, der skal underskrives af chefen"></div>
                                        <div class="option" data-option="En mundtlig aftale om fuldmagt og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Automatisk fuldmagt ved ansættelse i en stilling til sædvanlige handlinger"></div>
                                        <div class="option" data-option="En fuldmagt, der kun gælder i 1 år og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En bankrådgiver bevilger et lån på 2 mio. kr., selvom han kun måtte bevilge 1 mio. kr. internt. Kunden var i god tro. Hvad er konsekvensen efter AFTL § 11?"
                                        data-answer="0"
                                        data-explanation="Efter AFTL § 11, stk. 1 er banken bundet af aftalen, hvis kunden var i god tro (ikke indså eller burde indse, at rådgiveren overskred sin beføjelse). Banken hæfter for lånet. Rådgiveren bliver erstatningsansvarlig over for banken efter AFTL § 25.">
                                        <div class="option"
                                             data-option="Banken er bundet af aftalen, da kunden var i god tro"></div>
                                        <div class="option"
                                             data-option="Aftalen er ugyldig, da rådgiveren overskred sin beføjelse"></div>
                                        <div class="option"
                                             data-option="Kunden skal betale et gebyr for at få lånet godkendt"></div>
                                        <div class="option" data-option="Banken kan annullere lånet uden konsekvenser"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem fuldmagt og beføjelse?"
                                        data-answer="1"
                                        data-explanation="Fuldmagt er hvad omverdenen (kunden) med rette kan tro, at den ansatte må. Beføjelse er hvad den ansatte rent faktisk har fået lov til internt. En rådgiver kan have fuldmagt til at bevilge lån (det ser normalt ud), men internt begrænset beføjelse (max 1 mio. kr.).">
                                        <div class="option" data-option="Der er ingen forskel, det er det samme begreb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Fuldmagt er hvad omverdenen kan tro, beføjelse er den interne instruks"></div>
                                        <div class="option" data-option="Fuldmagt er kun for direktører, beføjelse er for alle ansatte"></div>
                                        <div class="option" data-option="Fuldmagt er skriftlig, beføjelse er mundtlig, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvordan tilbagekaldes en stillingsfuldmagt efter AFTL § 15?"
                                        data-answer="3"
                                        data-explanation="Efter AFTL § 15 tilbagekaldes en stillingsfuldmagt derved, at fuldmægtigen fjernes fra stillingen. Når banken fyrer ham eller flytter ham til en anden stilling, ophører fuldmagten automatisk.">
                                        <div class="option" data-option="Ved skriftlig erklæring til fuldmægtigen"></div>
                                        <div class="option" data-option="Ved offentlig bekendtgørelse i avisen"></div>
                                        <div class="option" data-option="Ved at kræve dokumentet tilbage"></div>
                                        <div class="option"
                                             data-option="Ved at fjerne fuldmægtigen fra stillingen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En skriftlig fuldmagt er overgivet fuldmægtigen og skal forevises for tredjemand. Hvordan tilbagekaldes den efter AFTL § 16?"
                                        data-answer="2"
                                        data-explanation="Efter AFTL § 16 tilbagekaldes en skriftlig fuldmagt, som er overgivet fuldmægtigen og skal forevises for tredjemand, derved at den på fuldmagtsgiverens forlangende tilbagegives til ham eller erklæres ugyldig. Fuldmægtigen er pligtig til at give fuldmagten tilbage på forlangende.">
                                        <div class="option" data-option="Ved mundtlig meddelelse til fuldmægtigen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ved offentlig bekendtgørelse, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Ved at kræve dokumentet tilbage eller få det erklæret ugyldig"></div>
                                        <div class="option" data-option="Ved at sende en email til fuldmægtigen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En fuldmagt er bragt til tredjemands kundskab ved en særskilt erklæring. Hvordan tilbagekaldes den efter AFTL § 13?"
                                        data-answer="1"
                                        data-explanation="Efter AFTL § 13 tilbagekaldes en fuldmagt, som er bragt til tredjemands kundskab ved en særskilt erklæring, ved at give tredjemand en ny særskilt erklæring om, at fuldmagten ikke længere gælder. Tilbagekaldelsen skal ske på samme måde som fuldmagten blev givet.">
                                        <div class="option"
                                             data-option="Ved mundtlig meddelelse til fuldmægtigen"></div>
                                        <div class="option"
                                             data-option="Ved særskilt erklæring til tredjemand"></div>
                                        <div class="option"
                                             data-option="Ved at fjerne fuldmægtigen fra stillingen"></div>
                                        <div class="option"
                                             data-option="Ved offentlig bekendtgørelse i avisen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der med en fuldmagt, når fuldmagtsgiveren dør efter AFTL § 21?"
                                        data-answer="0"
                                        data-explanation="Efter AFTL § 21 er fuldmagten alligevel gældende efter dødsfaldet, for såvidt det ikke følger af særlige omstændigheder, at den skal bortfalde. Fuldmagten ophører fra udløbet af det døgn, hvor bekendtgørelse i Statstidende af indkaldelse til fordringshaverne finder sted.">
                                        <div class="option"
                                             data-option="Fuldmagten fortsætter normalt, men ophører fra døgn, hvor dødsboet bekendtgøres i Statstidende"></div>
                                        <div class="option" data-option="Fuldmagten ophører straks ved dødsfaldet hvilket er standard praksis"></div>
                                        <div class="option" data-option="Fuldmagten fortsætter uindskrænket, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Fuldmagten skal bekræftes af arvingerne, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad siger AFTL § 25 om bevisbyrde ved fuldmagt?"
                                        data-answer="2"
                                        data-explanation="Efter AFTL § 25 indestår den, der optræder som fuldmægtig for en anden, for at han har fornøden fuldmagt. Oplyser han ikke, at han havde sådan, eller at hans retshandel er godkendt af den opgivne fuldmagtsgiver, er han erstatningsansvarlig overfor den, som i god tro har handlet med ham.">
                                        <div class="option" data-option="Fuldmægtigen skal ikke bevise noget, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Tredjemand skal bevise, at fuldmægtigen havde fuldmagt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Fuldmægtigen indestår for, at han har fuldmagt, og hæfter ved manglende fuldmagt"></div>
                                        <div class="option" data-option="Fuldmagtsgiveren skal altid bevise, at fuldmægtigen manglede fuldmagt"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En bank har internt sagt til rådgiveren: 'Du må ikke længere bruge din fuldmagt'. Kan banken påberåbe sig dette overfor kunder efter AFTL § 20?"
                                        data-answer="3"
                                        data-explanation="Efter AFTL § 20 kan banken ikke påberåbe sig et internt forbud mod brug af fuldmagt overfor tredjemand, medmindre denne vidste eller burde vide det. Hvis kunderne ikke vidste eller burde vide om forbuddet, er banken bundet af rådgiverens handlinger.">
                                        <div class="option" data-option="Ja, banken kan altid påberåbe sig interne forbud"></div>
                                        <div class="option" data-option="Ja, men kun hvis forbuddet er skriftligt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Nej, banken kan aldrig påberåbe sig interne forbud"></div>
                                        <div class="option"
                                             data-option="Nej, medmindre kunderne vidste eller burde vide om forbuddet"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der med en fuldmagt, når fuldmagtsgiveren går konkurs efter AFTL § 23?"
                                        data-answer="1"
                                        data-explanation="Efter AFTL § 23 kan tredjemand ikke opnå bedre rettigheder gennem fuldmægtigen, end de ville have fået direkte fra fuldmagtsgiveren. Dette beskytter konkursboet. Fuldmægtigen kan fortsætte med nødvendige handlinger for at bevare rettigheder efter AFTL § 24.">
                                        <div class="option" data-option="Fuldmagten ophører straks ved konkurs, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Tredjemand kan ikke opnå bedre rettigheder gennem fuldmægtigen, end de ville have fået direkte fra fuldmagtsgiveren"></div>
                                        <div class="option" data-option="Fuldmagten fortsætter uindskrænket, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                        <div class="option" data-option="Fuldmagten skal bekræftes af kuratoren, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En CFO optager et lån på 10 mio. kr. uden bestyrelsens godkendelse, selvom vedtægterne kræver godkendelse for lån over 5 mio. kr. Banken kendte ikke vedtægterne. Hvad er konsekvensen?"
                                        data-answer="0"
                                        data-explanation="Efter AFTL § 11 er virksomheden bundet, hvis banken var i god tro (ikke kendte eller burde kende vedtægternes begrænsning). Hvis vedtægterne er offentligt tilgængelige (fx via CVR), burde banken have vidst om kravet → Banken var i ond tro → Virksomheden er ikke bundet. CFO'en risikerer fyring og erstatningskrav.">
                                        <div class="option"
                                             data-option="Afhænger af om banken kendte eller burde kende vedtægternes begrænsning"></div>
                                        <div class="option" data-option="Virksomheden er altid bundet, uanset bankens viden hvilket er standard praksis"></div>
                                        <div class="option" data-option="Lånet er altid ugyldigt på grund af manglende godkendelse"></div>
                                        <div class="option" data-option="CFO'en hæfter personligt, men virksomheden er ikke bundet"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem stillingsfuldmagt og skriftlig fuldmagt?"
                                        data-answer="2"
                                        data-explanation="Stillingsfuldmagt gives automatisk ved ansættelse i en stilling og ophører ved fyring eller flytning. Skriftlig fuldmagt er et dokument, der skal forevises for tredjemand og tilbagekaldes ved at kræve dokumentet tilbage eller få det erklæret ugyldig.">
                                        <div class="option" data-option="Der er ingen forskel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Stillingsfuldmagt er kun for direktører, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Stillingsfuldmagt gives automatisk ved ansættelse, skriftlig fuldmagt er et dokument"></div>
                                        <div class="option" data-option="Skriftlig fuldmagt er altid stærkere end stillingsfuldmagt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En revisor underskriver en IT-kontrakt på 500.000 kr. på vegne af sin klient uden skriftlig fuldmagt. Har revisoren stillingsfuldmagt til dette?"
                                        data-answer="3"
                                        data-explanation="En revisor har typisk IKKE stillingsfuldmagt til at indgå store IT-kontrakter på vegne af klienten. Stillingsfuldmagt gælder kun for sædvanlige handlinger i stillingen. En revisor kan have fuldmagt til at give rådgivning, men ikke til at binde klienten i store kontrakter uden eksplicit fuldmagt. Klienten er derfor ikke bundet. Revisoren hæfter personligt efter AFTL § 25.">
                                        <div class="option" data-option="Ja, revisorer har altid stillingsfuldmagt til alle kontrakter"></div>
                                        <div class="option" data-option="Ja, men kun for kontrakter under 100.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Nej, revisorer har aldrig stillingsfuldmagt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Nej, revisorer har typisk ikke stillingsfuldmagt til store kontrakter"></div>
                                   </div>

                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
