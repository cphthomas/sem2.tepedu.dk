<body data-formål="Forståelse af lempelse og nedsættelse af erstatningsansvar (EAL §§ 23-24) samt regler om flere erstatningsansvarlige og solidarisk ansvar (EAL § 25)." data-forudsætning-url="https://jura.tepedu.dk/kapitel4.html" data-forudsætning-text="Online-bog Jura Kapitel 4: Erstatning" data-forudsætning="">

     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Jura: Erstatning - Lempelse og Flere Ansvarlige (EAL §§ 23-25)
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad handler EAL § 23 om?"
                                        data-answer="1"
                                        data-explanation="EAL § 23 handler om lempelse for ansatte: Arbejdstagers erstatningsansvar kan lempes helt eller delvist, navnlig hvis skaden er dækket af arbejdsgiverens ansvarsforsikring. Dette er meget brugt i finanssektoren.">
                                        <div class="option" data-option="Ansvarsfrihed ved forsikring, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option"
                                             data-option="Lempelse for ansatte - arbejdstagers ansvar kan lempes"></div>
                                        <div class="option" data-option="Solidarisk ansvar, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Forsikringsselskabets regres, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår kan en ansats erstatningsansvar lempes efter EAL § 23?"
                                        data-answer="2"
                                        data-explanation="En ansats erstatningsansvar kan lempes efter EAL § 23, navnlig hvis skaden er dækket af arbejdsgiverens ansvarsforsikring. Ved simpel uagtsomhed vil ansvar typisk lempes helt, så ansatte ikke skal betale af egen lomme.">
                                        <div class="option" data-option="Aldrig, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun ved forsæt, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                        <div class="option"
                                             data-option="Navnlig hvis skaden er dækket af arbejdsgiverens ansvarsforsikring - typisk ved simpel uagtsomhed"></div>
                                        <div class="option" data-option="Kun ved grov uagtsomhed, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på lempelse efter EAL § 23?"
                                        data-answer="0"
                                        data-explanation="Et eksempel er hvis en nyuddannet bankrådgiver laver en regnefejl, der koster kunden 50.000 kr. Rådgiverens personlige ansvar lempes (bortfalder), og banken (eller bankens forsikring) betaler. Rådgiveren skal ikke betale af egen lomme.">
                                        <div class="option"
                                             data-option="Bankrådgiver laver simpel fejl → ansvar lempes → banken/forsikring betaler"></div>
                                        <div class="option" data-option="Bankrådgiver snyder bevidst kunde → ansvar lempes, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="Kun banken hæfter altid, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Kun forsikringsselskabet hæfter og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 24 om?"
                                        data-answer="3"
                                        data-explanation="EAL § 24 handler om generel lempelsesregel: Erstatningsansvar kan lempes efter en konkret vurdering af alle omstændigheder, herunder skadevolders og skadelidtes forhold, skadens størrelse, forsikringsforhold mv. Dette gælder for alle, ikke kun ansatte.">
                                        <div class="option" data-option="Kun for ansatte, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun ved forsikringsdækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun ved personskade, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Generel lempelsesregel - kan lempes efter konkret vurdering af alle omstændigheder"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem EAL § 23 og EAL § 24?"
                                        data-answer="1"
                                        data-explanation="EAL § 23 er specifik for arbejdstagere - arbejdstagers ansvar kan lempes, navnlig hvis skaden er dækket af arbejdsgiverens ansvarsforsikring. EAL § 24 er generel for alle - enhver erstatningsansvar kan lempes efter konkret vurdering af alle omstændigheder.">
                                        <div class="option" data-option="Der er ingen forskel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="§ 23 er specifik for arbejdstagere, § 24 er generel for alle"></div>
                                        <div class="option" data-option="§ 23 er generel, § 24 er specifik, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Begge handler om det samme, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilke faktorer vurderes ved lempelse efter EAL § 24?"
                                        data-answer="2"
                                        data-explanation="Ved lempelse efter EAL § 24 vurderes alle omstændigheder, herunder: skadevolders og skadelidtes forhold, skadens størrelse, forsikringsforhold, skadevolders økonomiske forhold mv. Det er en konkret vurdering.">
                                        <div class="option" data-option="Kun skadens størrelse, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Kun forsikringsforhold, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Skadevolders og skadelidtes forhold, skadens størrelse, forsikringsforhold, økonomiske forhold mv."></div>
                                        <div class="option" data-option="Kun skadevolders forhold, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på lempelse efter EAL § 24?"
                                        data-answer="0"
                                        data-explanation="Et eksempel er hvis en lille lokal sparekasse rådgiver fejlagtigt om et meget komplekst produkt. Erstatningskravet er så stort, at sparekassen vil gå konkurs. Domstolen kan nedsætte (lempe) kravet for at redde sparekassen, hvis kunden er en stor professionel investor (som selv burde vide bedre).">
                                        <div class="option"
                                             data-option="Lille sparekasse med stort erstatningskrav → kan lempes for at redde sparekassen"></div>
                                        <div class="option" data-option="Bankrådgiver laver simpel fejl → ansvar lempes hvilket er standard praksis"></div>
                                        <div class="option" data-option="Forsikringsselskabet betaler erstatning, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Skadevolder er ansvarsfri, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 25 om?"
                                        data-answer="3"
                                        data-explanation="EAL § 25 handler om flere erstatningsansvarlige: Hvis flere er erstatningsansvarlige, hæfter de solidarisk. Skadelidte kan kræve hele erstatningen af én af de ansvarlige. Indbyrdes fordeling sker efter, hvad der må anses for rimeligt.">
                                        <div class="option" data-option="Lempelse for ansatte, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Ansvarsfrihed ved forsikring og skal overholdes, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="Forsikringsselskabets regres og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Flere erstatningsansvarlige - solidarisk ansvar og indbyrdes fordeling"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad betyder 'solidarisk ansvar' efter EAL § 25?"
                                        data-answer="1"
                                        data-explanation="Solidarisk ansvar betyder at hvis flere er erstatningsansvarlige, hæfter de solidarisk. Det betyder at skadelidte kan kræve hele erstatningen af én af de ansvarlige. Den ansvarlige, der betaler, kan derefter kræve sin del tilbage fra de andre efter indbyrdes fordeling.">
                                        <div class="option" data-option="At hver ansvarlig kun hæfter for sin egen del"></div>
                                        <div class="option"
                                             data-option="At skadelidte kan kræve hele erstatningen af én af de ansvarlige"></div>
                                        <div class="option" data-option="At ingen hæfter, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="At kun forsikringsselskabet hæfter, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvordan fordeles ansvaret indbyrdes efter EAL § 25?"
                                        data-answer="2"
                                        data-explanation="Indbyrdes fordeling mellem de ansvarlige sker efter, hvad der må anses for rimeligt under hensyn til: graden af skyld, skadeevnen af hver handling, og forsikringsforhold. Det er en konkret vurdering.">
                                        <div class="option" data-option="Lige fordeling mellem alle, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun efter skadens størrelse og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Efter rimelighed - graden af skyld, skadeevne og forsikringsforhold"></div>
                                        <div class="option" data-option="Kun efter forsikringsforhold og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på solidarisk ansvar efter EAL § 25?"
                                        data-answer="0"
                                        data-explanation="Et eksempel er hvis både bank og ejendomsmægler hæfter for fejl ved boligkøb. Skadelidte kan kræve hele erstatningen af enten banken eller mægleren (solidarisk ansvar). Indbyrdes fordeles ansvaret efter § 25, fx 60% bank, 40% mægler, afhængigt af graden af skyld.">
                                        <div class="option"
                                             data-option="Bank og ejendomsmægler hæfter begge → skadelidte kan kræve hele beløbet af én af dem"></div>
                                        <div class="option" data-option="Kun banken hæfter hvilket er standard praksis, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Kun mægleren hæfter, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Ingen hæfter, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 24a om?"
                                        data-answer="3"
                                        data-explanation="EAL § 24a handler om lempelse for børn: Erstatningsansvar for skader forvoldt af børn under 15 år kan lempes eller bortfalde. Dette er vigtigt for forsikringsselskaber, der håndterer sager hvor børn forårsager skade.">
                                        <div class="option" data-option="Lempelse for ansatte, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Solidarisk ansvar, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Ansvarsfrihed ved forsikring, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option"
                                             data-option="Lempelse for børn under 15 år - ansvar kan lempes eller bortfalde"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 24b om?"
                                        data-answer="1"
                                        data-explanation="EAL § 24b handler om lempelse ved utilregnelighed: Erstatningsansvar kan lempes eller bortfalde ved sindssygdom, demens eller lignende tilstande. Dette er vigtigt for forsikringsselskaber, der håndterer sager hvor utilregnelige forårsager skade.">
                                        <div class="option" data-option="Lempelse for ansatte, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Lempelse ved utilregnelighed (sindssygdom, demens mv.)"></div>
                                        <div class="option" data-option="Solidarisk ansvar, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Ansvarsfrihed ved forsikring, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der, hvis både revisor og bank hæfter for samme skade?"
                                        data-answer="2"
                                        data-explanation="Hvis både revisor og bank hæfter for samme skade, hæfter de solidarisk efter EAL § 25. Skadelidte kan kræve hele erstatningen af enten revisoren eller banken. Indbyrdes fordeles ansvaret efter rimelighed, fx 70% revisor (hovedskylden), 30% bank.">
                                        <div class="option" data-option="Kun revisor hæfter, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Kun bank hæfter, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option"
                                             data-option="Begge hæfter solidarisk - skadelidte kan kræve hele beløbet af én af dem"></div>
                                        <div class="option" data-option="Ingen hæfter, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Kan lempelse efter EAL § 23 og § 24 kombineres?"
                                        data-answer="0"
                                        data-explanation="Ja, lempelse efter EAL § 23 og § 24 kan kombineres. En ansats ansvar kan lempes efter § 23, og hvis der er særlige omstændigheder, kan ansvaret yderligere lempes efter § 24. Det er en konkret vurdering af alle omstændigheder.">
                                        <div class="option"
                                             data-option="Ja, de kan kombineres - konkret vurdering af alle omstændigheder"></div>
                                        <div class="option" data-option="Nej, kun én af dem kan anvendes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun § 23 kan anvendes, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun § 24 kan anvendes og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
