<body data-formål="Forståelse af pant i løsøre, herunder bilbogen, personbogen og virksomhedspant." data-forudsætning-url="https://jura.tepedu.dk/kapitel6.html" data-forudsætning-text="Online-bog Jura Kapitel 6: Ejendomshandel, Tinglysning & Pant" data-forudsætning="">

             target="_blank"><img src="tepedulogo.svg"
                    alt="Logo"

          <h2>Quiz Jura - Pant i Løsøre</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Jura: Pant i Løsøre
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er løsøre?"
                                        data-answer="1"
                                        data-explanation="Løsøre er alt andet end fast ejendom. Reglerne for pant i løsøre afhænger af aktivtypen. Eksempler på løsøre: Biler, maskiner, inventar, varelager.">
                                        <div class="option" data-option="Fast ejendom, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Alt andet end fast ejendom (biler, maskiner, inventar, varelager)"></div>
                                        <div class="option" data-option="Kun biler, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun maskiner, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvor skal pant i biler tinglyses?"
                                        data-answer="2"
                                        data-explanation="Pant i biler, motorcykler og campingvogne skal tinglyses i Bilbogen. Det er den eneste gyldige sikringsakt. Det er ikke nok at beholde registreringsattesten eller nøglerne. Eksempel: Banken tager pant i bil. Pantet skal tinglyses i Bilbogen. Uden tinglysning er pantet ikke gyldigt mod andre kreditorer.">
                                        <div class="option" data-option="I Personbogen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="I Tingbogen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="I Bilbogen - det er den eneste gyldige sikringsakt"></div>
                                        <div class="option" data-option="Ved at beholde registreringsattesten"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsforbehold ved bilkøb?"
                                        data-answer="0"
                                        data-explanation="Ejendomsforbehold betyder at bilforhandler tager ejendomsforbehold i bilen ved køb på afbetaling. Dette skal tinglyses i Bilbogen. Hvis kunden ikke betaler, kan forhandleren tage bilen tilbage. Eksempel: Kunde køber bil for 300.000 kr. på afbetaling. Forhandleren tager ejendomsforbehold og tinglyser det i Bilbogen.">
                                        <div class="option"
                                             data-option="Bilforhandler tager ejendomsforbehold ved køb på afbetaling, der skal tinglyses i Bilbogen"></div>
                                        <div class="option" data-option="Banken tager pant i bilen hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kunden beholder bilen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Bilen sælges på tvangsauktion, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er prioritetsordenen ved pant i bil?"
                                        data-answer="3"
                                        data-explanation="Pant i bil dækkes i den rækkefølge, det er tinglyst. Første pantebrev tinglyses først → 1. prioritet. Andet pantebrev tinglyses derefter → 2. prioritet. Ved tvangsauktion får første panthaver først dækning.">
                                        <div class="option" data-option="Den største panthaver får først dækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Alle panthaver får lige stor dækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Den mindste panthaver får først dækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Pant dækkes i den rækkefølge, det er tinglyst - 'først i tid, bedst i ret'"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvor skal pant i maskiner og inventar tinglyses?"
                                        data-answer="1"
                                        data-explanation="Pant i maskiner, inventar, varelager osv. tinglyses i Personbogen. Eksempel: Banken tager pant i maskiner. Pantet tinglyses i Personbogen. Uden tinglysning er pantet ikke gyldigt mod andre kreditorer.">
                                        <div class="option" data-option="I Bilbogen"></div>
                                        <div class="option"
                                             data-option="I Personbogen"></div>
                                        <div class="option" data-option="I Tingbogen"></div>
                                        <div class="option"
                                             data-option="Ved at beholde maskinerne"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er underpant?"
                                        data-answer="2"
                                        data-explanation="Underpant betyder at debitor beholder tingen og kan bruge den. Det kræver tinglysning. Eksempel: Virksomhed pantsætter maskiner til banken. Virksomheden kan stadig bruge maskinerne i produktionen, men banken har pant i dem. Pantet tinglyses i Personbogen.">
                                        <div class="option" data-option="Kreditor får tingen fysisk, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Pant uden tinglysning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Debitor beholder tingen og kan bruge den, men pantet skal tinglyses"></div>
                                        <div class="option" data-option="Pant i fast ejendom, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er håndpant?"
                                        data-answer="0"
                                        data-explanation="Håndpant betyder at kreditor får tingen fysisk. Det kræver ikke tinglysning, men rådighedsberøvelse. Dette er sjældent i moderne finansiering. Eksempel: Pantelåneren tager tingen fysisk.">
                                        <div class="option"
                                             data-option="Kreditor får tingen fysisk - kræver ikke tinglysning, men rådighedsberøvelse"></div>
                                        <div class="option" data-option="Debitor beholder tingen hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Pant i fast ejendom, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Pant i bil, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er virksomhedspant?"
                                        data-answer="3"
                                        data-explanation="Virksomhedspant er en særlig form for pant, hvor virksomheden pantsætter 'alt hvad den ejer og fremtidig erhverver' af visse aktivtyper under ét. Det omfatter typisk varelager, driftsinventar og maskiner, samt tilgodehavender. Pantet skal tinglyses i Personbogen.">
                                        <div class="option" data-option="Pant i fast ejendom, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Pant i bil, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Pant i én specifik maskine, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Pant i 'alt hvad virksomheden ejer og fremtidig erhverver' af visse aktivtyper under ét"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilke aktivtyper omfatter virksomhedspant typisk?"
                                        data-answer="1"
                                        data-explanation="Virksomhedspant omfatter typisk: Varelager (varer på lager, der sælges og erstattes løbende), driftsinventar og maskiner (maskiner og inventar, der bruges i driften), og tilgodehavender (fordringer fra kunder/debitorer).">
                                        <div class="option" data-option="Kun fast ejendom, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Varelager, driftsinventar og maskiner, samt tilgodehavender"></div>
                                        <div class="option" data-option="Kun biler, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun kontanter og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er flydende pant ved virksomhedspant?"
                                        data-answer="2"
                                        data-explanation="Flydende pant betyder at pantet dækker varer, der sælges og erstattes løbende. Eksempel: Butik pantsætter varelager til banken. Butikken kan stadig sælge varerne, men nye varer, der købes, bliver automatisk pantsat.">
                                        <div class="option" data-option="Pant i vand, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                        <div class="option" data-option="Pant der ophæves automatisk, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Pant der dækker varer, der sælges og erstattes løbende - nye varer bliver automatisk pantsat"></div>
                                        <div class="option" data-option="Pant i fast ejendom, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er factoring?"
                                        data-answer="0"
                                        data-explanation="Factoring er hvor virksomhedspant i debitorer bruges, og virksomheden sælger fakturaer til banken. Eksempel: Virksomhed pantsætter alle fakturaer til banken. Pantet tinglyses i Personbogen. Virksomhed sælger fakturaer på 500.000 kr. til banken for 475.000 kr. (5% rabat).">
                                        <div class="option"
                                             data-option="Virksomhed sælger fakturaer til banken mod rabat"></div>
                                        <div class="option" data-option="Pant i fast ejendom, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Pant i bil, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Lejekontrakt, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er denunciation ved factoring?"
                                        data-answer="3"
                                        data-explanation="Denunciation er hvor banken skal give kunderne besked om overdragelsen. Eksempel: Banken sender brev til kunderne om, at de nu skal betale til banken. Dette er Denunciation (GBL § 31).">
                                        <div class="option" data-option="Pant i fakturaer, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Salg af fakturaer og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Betaling fra kunder og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Banken skal give kunderne besked om overdragelsen af fakturaer"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der med fremtidige aktiver ved virksomhedspant?"
                                        data-answer="1"
                                        data-explanation="Pantet dækker også aktiver, der erhverves i fremtiden. Eksempel: Virksomhed pantsætter varelager. Nye varer, der købes, bliver automatisk pantsat uden nyt pantebrev.">
                                        <div class="option" data-option="De er ikke dækket af pantet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="De bliver automatisk pantsat uden nyt pantebrev"></div>
                                        <div class="option" data-option="De skal tinglyses separat, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="De ophæver pantet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad omfatter virksomhedspant IKKE?"
                                        data-answer="2"
                                        data-explanation="Virksomhedspant omfatter ikke fast ejendom, skibe eller biler (der har deres egne registre). Virksomhedspant dækker kun løsøre som varelager, maskiner, inventar og debitorer.">
                                        <div class="option" data-option="Varelager, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Debitorer, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Fast ejendom, skibe eller biler (de har deres egne registre)"></div>
                                        <div class="option" data-option="Maskiner, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der ved tvangsauktion af bil, hvis der er pant?"
                                        data-answer="0"
                                        data-explanation="Ved misligholdelse kan panthaver kræve bilen solgt på tvangsauktion. Salgssummen fordeles efter prioritetsordenen. Eksempel: Kunde stopper med at betale. Banken kræver bilen solgt på tvangsauktion. Salgssummen fordeles efter prioritetsordenen.">
                                        <div class="option"
                                             data-option="Bilen sælges på tvangsauktion, og salgssummen fordeles efter prioritetsordenen"></div>
                                        <div class="option" data-option="Bilen ophæves automatisk hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Bilen gives tilbage til kunden, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Pantet ophæves, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem underpant og håndpant?"
                                        data-answer="3"
                                        data-explanation="Underpant betyder at debitor beholder tingen og kan bruge den, men pantet skal tinglyses. Håndpant betyder at kreditor får tingen fysisk, kræver ikke tinglysning, men rådighedsberøvelse. Håndpant er sjældent i moderne finansiering.">
                                        <div class="option" data-option="Der er ingen forskel, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Begge kræver tinglysning, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Begge kræver ikke tinglysning, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Underpant: debitor beholder tingen, skal tinglyses. Håndpant: kreditor får tingen fysisk, kræver ikke tinglysning"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvorfor er tinglysning vigtigt ved pant i løsøre?"
                                        data-answer="1"
                                        data-explanation="Uden tinglysning er pantet ikke gyldigt mod andre kreditorer. Ved konkurs kan utinglyst pant miste sin sikkerhed. Pantet skal tinglyses for at være gyldigt. Eksempel: Banken tager pant i maskiner. Pantet tinglyses i Personbogen. Uden tinglysning er pantet ikke gyldigt mod andre kreditorer.">
                                        <div class="option" data-option="Det er ikke vigtigt, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Uden tinglysning er pantet ikke gyldigt mod andre kreditorer - kan miste sikkerhed ved konkurs"></div>
                                        <div class="option" data-option="Det giver lavere rente, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Det giver højere prioritet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er fordelene ved virksomhedspant?"
                                        data-answer="2"
                                        data-explanation="Virksomhedspant giver banken sikkerhed i flere aktivtyper under ét. Virksomheden kan stadig bruge aktiverne i driften (fx sælge varelager). Pantet dækker også fremtidige aktiver automatisk. Det er meget fleksibelt for både banken og virksomheden.">
                                        <div class="option" data-option="Det er billigere end pant i fast ejendom, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Det giver højere prioritet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Giver sikkerhed i flere aktivtyper under ét, virksomheden kan stadig bruge aktiverne, dækker også fremtidige aktiver"></div>
                                        <div class="option" data-option="Det giver lavere rente, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>
                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
