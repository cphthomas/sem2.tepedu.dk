<body data-formål="Forståelse af personskadeerstatning efter Erstatningsansvarsloven §§ 1-5 og 13-14, herunder tabt arbejdsfortjeneste, erhvervsevnetab, svie og smerte, varigt mén og forsørgertab." data-forudsætning-url="https://jura.tepedu.dk/kapitel4.html" data-forudsætning-text="Online-bog Jura Kapitel 4: Erstatning" data-forudsætning="">
     <header> <a href="index.html"
             target="_blank"><img src="tepedulogo.svg"
                    alt="Logo"
                    width="8%"></a>
          <h2>Quiz Jura - Erstatning</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Jura: Erstatning - Personskadeerstatning (EAL §§ 1-5)
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad handler Erstatningsansvarsloven §§ 1-5 om?"
                                        data-answer="2"
                                        data-explanation="EAL §§ 1-5 handler om personskadeerstatning - særlige regler når skaden er personskade (ikke kun økonomisk tab). Dette omfatter tabt arbejdsfortjeneste, erhvervsevnetab, svie og smerte, varigt mén osv.">
                                        <div class="option" data-option="Culpa-reglen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Forsikringsdækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Personskadeerstatning - særlige regler ved personskade"></div>
                                        <div class="option" data-option="Principalansvar, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 1 om?"
                                        data-answer="1"
                                        data-explanation="EAL § 1 handler om personskadeerstatning: Den erstatningsansvarlige skal betale erstatning for tabt arbejdsfortjeneste, helbredelsesudgifter og andet tab som følge af skaden samt godtgørelse for svie og smerte.">
                                        <div class="option" data-option="Culpa-reglen, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Tabt arbejdsfortjeneste, helbredelsesudgifter, andet tab og godtgørelse for svie og smerte"></div>
                                        <div class="option" data-option="Forsikringsdækning, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Varigt mén, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 2 om?"
                                        data-answer="0"
                                        data-explanation="EAL § 2 handler om varige følger af personskade: Har skaden fået varige følger, skal der tillige betales erstatning for tab eller forringelse af erhvervsevne. Dette udløser ofte store erstatningssummer.">
                                        <div class="option"
                                             data-option="Varige følger af personskade - erstatning for tab eller forringelse af erhvervsevne"></div>
                                        <div class="option" data-option="Tabt arbejdsfortjeneste hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Svie og smerte, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Varigt mén, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 3 om?"
                                        data-answer="3"
                                        data-explanation="EAL § 3 handler om godtgørelse for svie og smerte: Godtgørelse for svie og smerte ydes kun for kortvarige lidelser. Det er en 'trøstepræmie' for den midlertidige lidelse, typisk et fast beløb pr. sygedag.">
                                        <div class="option" data-option="Varige følger, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Erhvervsevnetab og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Varigt mén og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Godtgørelse for svie og smerte - kun for kortvarige lidelser"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 4 om?"
                                        data-answer="2"
                                        data-explanation="EAL § 4 handler om godtgørelse for varigt mén: Der ydes godtgørelse for varigt mén, hvor mén skal være mindst 5%. Méngraden fastsættes ud fra en lægelig tabel (Méntabstabellen).">
                                        <div class="option" data-option="Tabt arbejdsfortjeneste, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Svie og smerte, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Godtgørelse for varigt mén (mindst 5%)"></div>
                                        <div class="option" data-option="Erhvervsevnetab, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 5 om?"
                                        data-answer="1"
                                        data-explanation="EAL § 5 handler om erstatning for erhvervsevnetab: Der ydes erstatning for tab eller forringelse af erhvervsevne som følge af personskade. Dette er ofte den dyreste post, da det er et kapitaliseret engangsbeløb for fremtidig tabt indtjening.">
                                        <div class="option" data-option="Varigt mén, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Erstatning for erhvervsevnetab - ofte den dyreste post"></div>
                                        <div class="option" data-option="Svie og smerte, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Tabt arbejdsfortjeneste, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem EAL § 1 og EAL § 2?"
                                        data-answer="0"
                                        data-explanation="EAL § 1 handler om generel personskadeerstatning (tabt arbejdsfortjeneste, helbredelsesudgifter, svie og smerte). EAL § 2 handler specifikt om varige følger - hvis skaden har fået varige følger, skal der betales erstatning for tab eller forringelse af erhvervsevne.">
                                        <div class="option"
                                             data-option="§ 1 handler om generel personskadeerstatning, § 2 om varige følger og erhvervsevnetab"></div>
                                        <div class="option" data-option="Der er ingen forskel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="§ 1 handler om varige følger, § 2 om generel erstatning, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="§ 1 handler om forsikring, § 2 om erstatning og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem 'svie og smerte' (EAL § 3) og 'varigt mén' (EAL § 4)?"
                                        data-answer="3"
                                        data-explanation="Svie og smerte (EAL § 3) er for kortvarige lidelser - en 'trøstepræmie' for midlertidig lidelse. Varigt mén (EAL § 4) er for permanente fysiske mén (mindst 5%) - et engangsbeløb baseret på méngraden fra Méntabstabellen.">
                                        <div class="option" data-option="Der er ingen forskel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Begge handler om samme ting, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Svie og smerte er permanent, varigt mén er midlertidigt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Svie og smerte er for kortvarige lidelser, varigt mén er for permanente mén (mindst 5%)"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'erhvervsevnetab' (EAL §§ 2 og 5)?"
                                        data-answer="2"
                                        data-explanation="Erhvervsevnetab betyder tab eller forringelse af erhvervsevne som følge af personskade. Det kan være at man må gå ned i tid, skifte til dårligere betalt job eller helt miste arbejdsevnen. Dette er ofte den dyreste post i personskadeerstatning.">
                                        <div class="option" data-option="Tabt arbejdsfortjeneste i korte perioder, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Svie og smerte og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Tab eller forringelse af erhvervsevne - ofte den dyreste post"></div>
                                        <div class="option" data-option="Varigt mén og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på personskade i finanssektoren?"
                                        data-answer="1"
                                        data-explanation="Personskade er sjældnere end økonomisk tab i finanssektoren, men kan forekomme ved fysiske forhold (lokaler). Et eksempel er hvis en kunde falder over en løs ledning i bankens filial og brækker benet. Banken skal erstatte tabt arbejdsfortjeneste, helbredelsesudgifter og svie og smerte.">
                                        <div class="option" data-option="Fejlagtig investeringsrådgivning, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Kunde falder over løs ledning i bankens filial og brækker benet"></div>
                                        <div class="option" data-option="Fejl i ejendomsbeskrivelse, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Forsinket udbetaling af forsikring, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL §§ 13-14 om?"
                                        data-answer="0"
                                        data-explanation="EAL §§ 13-14 handler om forsørgertabserstatning ved dødsfald: Ved dødsfald ydes erstatning til efterladte for tab af forsørger. Dette er sjældent i finanssektoren, men kan forekomme ved særligt grove tilfælde med tragiske konsekvenser.">
                                        <div class="option"
                                             data-option="Forsørgertabserstatning ved dødsfald - sjældent i finanssektoren"></div>
                                        <div class="option" data-option="Varigt mén hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Svie og smerte, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Erhvervsevnetab, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad kræver personskadeerstatning ofte?"
                                        data-answer="3"
                                        data-explanation="Personskadeerstatning kræver ofte lægelig dokumentation og fastsættelse af méngrad. Dette er langt mere komplekst end ren økonomisk skadeerstatning, da det kræver ekspertvurdering af skadens omfang og konsekvenser.">
                                        <div class="option" data-option="Kun en regning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun en erklæring fra skadelidte, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun forsikringsdækning, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Lægelig dokumentation og fastsættelse af méngrad"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'Méntabstabellen'?"
                                        data-answer="2"
                                        data-explanation="Méntabstabellen er en lægelig tabel, der bruges til at fastsætte méngraden ved varigt mén. Méngraden fastsættes ud fra denne tabel, og der betales et engangsbeløb baseret på méngraden.">
                                        <div class="option" data-option="En tabel over forsikringssatser, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="En tabel over erstatningsbeløb, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option"
                                             data-option="En lægelig tabel til fastsættelse af méngrad ved varigt mén"></div>
                                        <div class="option" data-option="En tabel over arbejdsfortjeneste, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er den mindste méngrad for varigt mén (EAL § 4)?"
                                        data-answer="1"
                                        data-explanation="Den mindste méngrad for varigt mén er 5% ifølge EAL § 4. Der ydes godtgørelse for varigt mén, hvor mén skal være mindst 5%.">
                                        <div class="option"
                                             data-option="1%"></div>
                                        <div class="option"
                                             data-option="5%"></div>
                                        <div class="option"
                                             data-option="10%"></div>
                                        <div class="option"
                                             data-option="15%"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilken post i personskadeerstatning er typisk den dyreste?"
                                        data-answer="0"
                                        data-explanation="Erhvervsevnetab (EAL §§ 2 og 5) er typisk den dyreste post i personskadeerstatning, da det er et kapitaliseret engangsbeløb for fremtidig tabt indtjening frem til pensionsalderen. Dette kan løbe op i millioner.">
                                        <div class="option"
                                             data-option="Erhvervsevnetab - kapitaliseret engangsbeløb for fremtidig tabt indtjening"></div>
                                        <div class="option" data-option="Svie og smerte hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Varigt mén, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Helbredelsesudgifter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
