<body data-formål="Forståelse af ejendomsforbehold, underpantsforbud, misligholdelse og tilbagetagelse." data-forudsætning-url="https://jura.tepedu.dk/kapitel5.html" data-forudsætning-text="Online-bog Jura Kapitel 5: Kreditaftale, Kaution & Gældsbreve" data-forudsætning="">

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">

                              <div id="postProgressContent"

                                   <div>
                                        <h1>
                                             Jura: Ejendomsforbehold og underpantsforbud
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er ejendomsforbehold?"
                                        data-answer="1"
                                        data-explanation="Ejendomsforbehold er en sikkerhedsform ved kreditkøb, hvor sælgeren forbeholder sig ejendomsretten til varen, indtil købesummen er betalt. Dette giver sælgeren ret til at kræve varen tilbage ved misligholdelse.">
                                        <div class="option" data-option="At køberen ejer varen fra start, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="At sælgeren forbeholder sig ejendomsretten til varen, indtil købesummen er betalt"></div>
                                        <div class="option" data-option="At banken ejer varen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At varen er pantsat, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår er ejendomsforbehold gyldigt ifølge KAL § 34?"
                                        data-answer="2"
                                        data-explanation="Ejendomsforbehold er kun gyldigt, hvis: 1) Købesummen overstiger 1.000 kr., 2) Køberen har betalt mindst 20% i udbetaling, og 3) Ejendomsforbeholdet er aftalt skriftligt.">
                                        <div class="option" data-option="Altid ved kreditkøb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun hvis købesummen er over 10.000 kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Hvis købesummen overstiger 1.000 kr., køberen har betalt mindst 20% i udbetaling, og det er aftalt skriftligt"></div>
                                        <div class="option" data-option="Kun hvis køberen er under 30 år, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis køber køber bil til 200.000 kr. på kredit, hvor meget skal køberen have betalt i udbetaling for at ejendomsforbehold skal være gyldigt?"
                                        data-answer="0"
                                        data-explanation="Køberen skal have betalt mindst 20% af købesummen i udbetaling. 20% af 200.000 kr. = 40.000 kr. Hvis køberen kun har betalt 30.000 kr., er ejendomsforbeholdet ugyldigt.">
                                        <div class="option"
                                             data-option="Mindst 40.000 kr. (20% af 200.000 kr.)"></div>
                                        <div class="option" data-option="Mindst 10.000 kr. hvilket er standard praksis"></div>
                                        <div class="option" data-option="Mindst 100.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ingen udbetaling nødvendig, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er underpantsforbud ifølge KAL § 21?"
                                        data-answer="3"
                                        data-explanation="Underpantsforbud betyder, at forbrugeren må ikke pantsætte eller overdrage det købte som sikkerhed for anden gæld, før købesummen er betalt. Dette beskytter sælgerens ejendomsforbehold.">
                                        <div class="option" data-option="At køberen skal pantsætte varen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At sælgeren skal pantsætte varen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At banken skal pantsætte varen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="At forbrugeren må ikke pantsætte det købte som sikkerhed for anden gæld, før købesummen er betalt"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen, hvis køber pantsætter bilen i banken som sikkerhed for andet lån, før bilen er betalt?"
                                        data-answer="1"
                                        data-explanation="Dette er en overtrædelse af underpantsforbuddet. Sælger kan kræve bilen tilbage og annullere købsaftalen. Køberen har brudt reglen om, at varen ikke må pantsættes før købesummen er betalt.">
                                        <div class="option" data-option="Ingen konsekvens, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Sælger kan kræve bilen tilbage og annullere købsaftalen"></div>
                                        <div class="option" data-option="Kun et lille gebyr, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 100.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår kan kreditgiveren tage det solgte tilbage ved misligholdelse ifølge KAL § 37?"
                                        data-answer="2"
                                        data-explanation="Ved misligholdelse kan kreditgiveren ikke tage det solgte tilbage eller gøre særlige retsvirkninger gældende, medmindre dette er påkrævet på grund af særlige omstændigheder ved misligholdelsen. Kreditgiveren skal vurdere omfanget af misligholdelsen.">
                                        <div class="option" data-option="Straks ved én misligholdt betaling, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 1 mio. kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Kun hvis dette er påkrævet på grund af særlige omstændigheder ved misligholdelsen - kreditgiveren skal vurdere omfanget"></div>
                                        <div class="option" data-option="Altid ved misligholdelse, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad kan kreditgiveren medregne ved opgørelse ved tilbagetagelse ifølge KAL § 38?"
                                        data-answer="0"
                                        data-explanation="Ved tilbagetagelse kan kreditgiveren kun medregne: 1) Ubetalte del af fordringen (med fradrag efter KAL § 27), 2) Rente af forfaldne ydelser (ikke fremtidige renter), og 3) Nødvendige omkostninger ved tilbagetagelse.">
                                        <div class="option"
                                             data-option="Ubetalte del af fordringen, rente af forfaldne ydelser og nødvendige omkostninger"></div>
                                        <div class="option" data-option="Alle fremtidige renter og gebyrer hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kun hovedstolen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun gebyrerne, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal fradrages ved opgørelse ved tilbagetagelse?"
                                        data-answer="3"
                                        data-explanation="Ved opgørelse ved tilbagetagelse skal følgende fradrages: Fremtidige renter (ikke forfaldne renter), fremtidige gebyrer, og værdien af det solgte skal modregnes. Kun den faktiske gæld skal betales.">
                                        <div class="option" data-option="Kun hovedstolen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun forfaldne renter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun gebyrerne, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Fremtidige renter, fremtidige gebyrer og værdien af det solgte skal modregnes"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis det solgtes værdi overstiger kreditgiverens tilgodehavende, hvad kan kreditgiveren gøre ifølge KAL § 40?"
                                        data-answer="1"
                                        data-explanation="Hvis det solgtes værdi overstiger kreditgiverens tilgodehavende, kan kreditgiveren kun tage tingen tilbage, hvis overskuddet betales til forbrugeren. Eksempel: Bilen er værd 150.000 kr., men kreditgiveren kun har krav på 100.000 kr. Kreditgiveren kan kun tage bilen tilbage, hvis de betaler 50.000 kr. til køberen.">
                                        <div class="option" data-option="Kreditgiveren kan altid tage tingen tilbage, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Kreditgiveren kan kun tage tingen tilbage, hvis overskuddet betales til forbrugeren"></div>
                                        <div class="option" data-option="Kreditgiveren kan tage tingen tilbage uden at betale noget, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun hvis værdien er under 100.000 kr. og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen ved ugyldigt ejendomsforbehold ifølge KAL § 30?"
                                        data-answer="2"
                                        data-explanation="Hvis ejendomsforbeholdet ikke er gyldigt (fx manglende 20% udbetaling), har kreditgiveren kun krav på betaling af det beløb, hvormed tilgodehavende overstiger det solgtes værdi ved tilbagetagelse. Kreditgiveren kan søge tilladelse til at tage det solgte tilbage.">
                                        <div class="option" data-option="Ejendomsforbeholdet er automatisk gyldigt, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kreditgiveren mister alt krav, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Kreditgiveren har kun krav på betaling af differencen mellem tilgodehavende og værdi ved tilbagetagelse"></div>
                                        <div class="option" data-option="Kun hvis købesummen er under 1.000 kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'forsømmelighed' ifølge KAL § 41?"
                                        data-answer="0"
                                        data-explanation="Forsømmelighed betyder, at forbrugeren har udvist forsømmelighed ved brugen eller opbevaringen af varen. Hvis dette er tilfældet, kan kreditgiveren kræve betaling af overskydende beløb, selvom værdien overstiger tilgodehavende.">
                                        <div class="option"
                                             data-option="At forbrugeren har udvist forsømmelighed ved brugen eller opbevaringen - kreditgiveren kan kræve betaling af differencen"></div>
                                        <div class="option" data-option="At kreditgiveren har glemt noget hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At køberen har betalt for sent, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At sælgeren har glemt noget, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der med ejendomsforbeholdet, hvis bygningstilbehør indføres til pantsat ejendom ifølge TL § 38?"
                                        data-answer="3"
                                        data-explanation="Hvis bygningstilbehør (fx køkken) indføres til hus, der er pantsat til realkreditinstitut, ekstinkveres ejendomsforbeholdet. Panthaveren i fast ejendom (realkreditinstituttet) får rettighederne.">
                                        <div class="option" data-option="Ejendomsforbeholdet fortsætter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 1 mio. kr. og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun hvis køberen er under 30 år og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Ejendomsforbeholdet ekstinkveres - panthaveren i fast ejendom får rettighederne"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Kan sælgeren vindicere salgsgenstanden fra en senere erhverver?"
                                        data-answer="1"
                                        data-explanation="Sælger kan som udgangspunkt vindicere salgsgenstanden fra en senere erhverver. Dette betyder, at hvis køberen sælger varen videre til en tredjeperson, kan sælgeren kræve varen tilbage fra tredjepersonen. Undtagelse: Forhandlergrundsætningen - hvis varen sælges til en forhandler, kan sælgeren ikke vindicere en videresolgt genstand.">
                                        <div class="option" data-option="Nej, aldrig, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Ja, som udgangspunkt. Undtagelse: Forhandlergrundsætningen - hvis varen sælges til forhandler, kan sælgeren ikke vindicere en videresolgt genstand"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 100.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun hvis køberen er under 30 år, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der med ejendomsforbeholdet, hvis fordringen forældes?"
                                        data-answer="2"
                                        data-explanation="En sælgers ejendomsforbehold i leveret løsøre bortfalder ved forældelse af fordringen på købesummen (jf. FL § 25, stk. 4). Efter 10 år (eller 3 år fra forfaldstid for visse krav) kan fordringen ikke længere kræves, og ejendomsforbeholdet bortfalder.">
                                        <div class="option" data-option="Ejendomsforbeholdet fortsætter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 1 mio. kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Ejendomsforbeholdet bortfalder - sælgeren mister retten til at kræve varen tilbage"></div>
                                        <div class="option" data-option="Kun hvis køberen er over 60 år, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem kreditkøb og kontantlån vedrørende ejendomsforbehold?"
                                        data-answer="0"
                                        data-explanation="Ved kreditkøb er sælgeren kreditgiver, og kan derfor forbeholde sig ejendomsretten (ejendomsforbehold). Ved kontantlån er banken kreditgiver, og køberen ejer varen fra start. Ingen ejendomsforbehold ved kontantlån.">
                                        <div class="option"
                                             data-option="Ved kreditkøb kan sælgeren forbeholde sig ejendomsretten. Ved kontantlån ejer køberen varen fra start"></div>
                                        <div class="option" data-option="Der er ingen forskel hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Ved kontantlån kan sælgeren forbeholde sig ejendomsretten, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun ved kontantlån kan der være ejendomsforbehold, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis køber har behandlet bilen dårligt, og værdien er faldet fra 150.000 kr. til 100.000 kr., hvad kan kreditgiveren kræve ifølge KAL § 41?"
                                        data-answer="3"
                                        data-explanation="Hvis forbrugeren har udvist forsømmelighed ved brugen eller opbevaringen, kan kreditgiveren kræve betaling af differencen mellem oprindelig værdi og nuværende værdi. I dette tilfælde kan kreditgiveren kræve 50.000 kr., selvom værdien overstiger tilgodehavende.">
                                        <div class="option" data-option="Ingenting, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun den nuværende værdi, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hovedstolen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Betaling af differencen mellem oprindelig værdi og nuværende værdi (50.000 kr.)"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'forhandlergrundsætningen'?"
                                        data-answer="1"
                                        data-explanation="Forhandlergrundsætningen betyder, at hvis en genstand sælges med ejendomsforbehold til en forhandler af det solgte, kan sælgeren efter forhandlergrundsætningen ikke vindicere en videresolgt genstand. Dette beskytter kunderne, der køber fra forhandleren.">
                                        <div class="option" data-option="At forhandlere altid kan vindicere genstande, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="At sælgeren ikke kan vindicere en videresolgt genstand fra forhandleren - beskytter kunderne"></div>
                                        <div class="option" data-option="At forhandlere skal altid have ejendomsforbehold, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 100.000 kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
