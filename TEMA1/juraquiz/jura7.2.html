<body data-formål="Forståelse af pant i fast ejendom, pantebrevstyper, prioritetsordenen og tvangsauktion." data-forudsætning-url="https://jura.tepedu.dk/kapitel7.html" data-forudsætning-text="Online-bog Jura Kapitel 7: Ejendomshandel, Tinglysning & Pant" data-forudsætning="">

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"

                                   <div>
                                        <h1>
                                             Jura: Pant i Fast Ejendom
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er et realkreditpantebrev?"
                                        data-answer="2"
                                        data-explanation="Realkreditpantebrev er pantebrev udstedt til et realkreditinstitut mod udstedelse af obligationer. Det følger særlige regler om lånegrænser (fx 80% for boliger). Det er den primære finansiering af boligkøb med lav rente. Eksempel: Køber køber hus for 3 mio. kr. Realkreditinstituttet låner 2,4 mio. kr. (80%) mod pantebrev. Pantebrevet tinglyses som 1. prioritet.">
                                        <div class="option" data-option="Et pantebrev udstedt af banken, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Et pantebrev til sælger, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Pantebrev udstedt til et realkreditinstitut mod udstedelse af obligationer, typisk med lånegrænse på 80% for boliger"></div>
                                        <div class="option" data-option="Et pantebrev til virksomheder, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et ejerpantebrev?"
                                        data-answer="1"
                                        data-explanation="Ejerpantebrev er hvor ejeren udsteder et pantebrev til sig selv ('Jeg skylder mig selv 500.000 kr.'). Dette pantebrev underpantsættes derefter til banken som sikkerhed. Det bruges til sikkerhed for banklån, kassekreditter og boligkreditter. Det er meget fleksibelt, da det kan genbruges. Eksempel: Ejeren udsteder ejerpantebrev på 1 mio. kr. til sig selv. Dette underpantsættes til banken som sikkerhed for kassekredit.">
                                        <div class="option" data-option="Et pantebrev fra banken til ejeren, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Ejeren udsteder pantebrev til sig selv, som derefter underpantsættes til banken"></div>
                                        <div class="option" data-option="Et pantebrev fra realkreditinstituttet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Et pantebrev til sælger, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et skadesløsbrev?"
                                        data-answer="3"
                                        data-explanation="Skadesløsbrev er sikkerhed for et maksimalt beløb for enhver gæld, debitor måtte få til kreditor. 'Sikkerhed for alt mellemværende'. Det bruges ofte i erhvervsforhold mellem virksomhed og bank. Eksempel: Virksomhed pantsætter ejendom til banken med skadesløsbrev på 5 mio. kr. Dette dækker alle gældsforhold mellem virksomhed og bank op til 5 mio. kr.">
                                        <div class="option" data-option="Et pantebrev uden sikkerhed, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Et pantebrev kun til realkredit, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Et pantebrev til sælger, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Sikkerhed for et maksimalt beløb for enhver gæld, debitor måtte få til kreditor"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et sælgerpantebrev?"
                                        data-answer="0"
                                        data-explanation="Sælgerpantebrev udstedes af køber til sælger som del af købesummen. Det bruges hvis køber ikke kan låne det hele i bank/realkredit. Eksempel: Køber kan kun låne 2 mio. kr. i bank/realkredit, men huset koster 2,5 mio. kr. Køber udsteder sælgerpantebrev på 500.000 kr. til sælger.">
                                        <div class="option"
                                             data-option="Udstedt af køber til sælger som del af købesummen"></div>
                                        <div class="option" data-option="Udstedt af sælger til køber hvilket er standard praksis"></div>
                                        <div class="option" data-option="Udstedt af banken til køber, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Udstedt af realkreditinstituttet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er prioritetsordenen ved tvangsauktion?"
                                        data-answer="2"
                                        data-explanation="Prioritetsordenen betyder at rettigheder dækkes i den rækkefølge, de er anmeldt til tinglysning. 'Først i tid, bedst i ret'. Dette er afgørende ved tvangsauktion. Realkreditpantebrev tinglyses først → 1. prioritet. Bankpantebrev tinglyses derefter → 2. prioritet. Ved tvangsauktion får realkredit først dækning, derefter banken.">
                                        <div class="option" data-option="Den største panthaver får først dækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Den mindste panthaver får først dækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Rettigheder dækkes i den rækkefølge, de er anmeldt til tinglysning - 'først i tid, bedst i ret'"></div>
                                        <div class="option" data-option="Alle panthaver får lige stor dækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis et hus sælges på tvangsauktion for 2 mio. kr., og der er realkreditpantebrev på 1,5 mio. kr. (1. prioritet) og bankpantebrev på 0,8 mio. kr. (2. prioritet), hvem får hvad?"
                                        data-answer="1"
                                        data-explanation="Realkreditinstituttet får først 1,5 mio. kr. (fuld dækning). Banken får derefter resten (0,5 mio. kr.), men taber 300.000 kr. af sin gæld. Der er ikke flere penge tilbage til 3. prioritet.">
                                        <div class="option" data-option="Realkredit får 1 mio. kr., banken får 0,8 mio. kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Realkredit får 1,5 mio. kr. (fuld dækning), banken får 0,5 mio. kr. (taber 300.000 kr.)"></div>
                                        <div class="option" data-option="Realkredit får 0,8 mio. kr., banken får 1,2 mio. kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Begge får lige meget: 1 mio. kr. hver og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er den typiske lånegrænse for realkreditpantebrev ved boligkøb?"
                                        data-answer="3"
                                        data-explanation="Realkreditinstitutter kan typisk låne op til 80% af ejendommens værdi (for boliger). Eksempel: Huset koster 3 mio. kr. Realkreditinstituttet kan låne op til 2,4 mio. kr. (80%). Resten skal finansieres med banklån eller egenkapital.">
                                        <div class="option"
                                             data-option="50% af ejendommens værdi"></div>
                                        <div class="option"
                                             data-option="60% af ejendommens værdi"></div>
                                        <div class="option"
                                             data-option="100% af ejendommens værdi"></div>
                                        <div class="option"
                                             data-option="80% af ejendommens værdi"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilken prioritet får realkreditpantebrev typisk?"
                                        data-answer="0"
                                        data-explanation="Realkreditpantebreve tinglyses normalt som 1. prioritet. Realkreditpantebrev tinglyses først → 1. prioritet. Bankpantebrev tinglyses derefter → 2. prioritet.">
                                        <div class="option"
                                             data-option="1. prioritet"></div>
                                        <div class="option"
                                             data-option="2. prioritet"></div>
                                        <div class="option"
                                             data-option="3. prioritet"></div>
                                        <div class="option"
                                             data-option="4. prioritet"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er fordelene ved ejerpantebrev?"
                                        data-answer="2"
                                        data-explanation="Ejerpantebreve er meget fleksible og kan genbruges ved nye lån uden at udstede nyt pantebrev. Pantebrevet kan bruges til forskellige formål (kassekredit, banklån, boligkredit). Eksempel: Ejeren har ejerpantebrev på 1 mio. kr. Efter 5 år vil ejeren låne 200.000 kr. mere. Pantebrevet kan genbruges, så det nu dækker 1,2 mio. kr.">
                                        <div class="option" data-option="Det er billigere end realkreditpantebrev"></div>
                                        <div class="option" data-option="Det giver højere prioritet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Det er fleksibelt og kan genbruges ved nye lån"></div>
                                        <div class="option" data-option="Det giver lavere rente, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der ved førtidig indfrielse af et fastforrentet realkreditlån?"
                                        data-answer="1"
                                        data-explanation="Kunden kan altid betale lånet ud før tid, men kan betale kompensation ved fast rente. Eksempel: Kunde vil betale fastforrentet lån ud før tid. Realkreditinstituttet kan kræve kompensation for rentetab (typisk 2-5% af restgælden).">
                                        <div class="option" data-option="Det er gratis at betale lånet ud, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Kunden kan betale lånet ud, men kan betale kompensation for rentetab (typisk 2-5% af restgælden)"></div>
                                        <div class="option" data-option="Det er ikke muligt at betale lånet ud før tid, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kunden skal betale hele lånet plus renter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem fastforrentet og variabelt realkreditlån?"
                                        data-answer="3"
                                        data-explanation="Realkreditlån kan være fastforrentet eller variabelt. Fastforrentet lån har fast rente i fx 30 år. Variabelt lån har variabel rente baseret på CIBOR + margin. Eksempel: Fastforrentet lån til 3% i 30 år eller variabelt lån til CIBOR + 1,5%. Kunden vælger selv.">
                                        <div class="option" data-option="Der er ingen forskel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Fastforrentet er altid dyrere, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Variabelt er altid billigere, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Fastforrentet har fast rente, variabelt har rente der ændrer sig (fx CIBOR + margin)"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er det første trin i tvangsauktionsprocessen?"
                                        data-answer="0"
                                        data-explanation="Det første trin i tvangsauktionsprocessen er misligholdelse. Debitor betaler ikke sine terminer. Eksempel: Kunde stopper med at betale realkreditlån. Efter 3 måneders misligholdelse kan realkreditinstituttet kræve tvangsauktion.">
                                        <div class="option"
                                             data-option="Misligholdelse - debitor betaler ikke sine terminer"></div>
                                        <div class="option" data-option="Rykker sendes til debitor hvilket er standard praksis"></div>
                                        <div class="option" data-option="Ansøgning om tvangsauktion, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Vurdering af ejendommen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der efter at panthaver sender rykker til debitor?"
                                        data-answer="2"
                                        data-explanation="Efter rykker kan panthaver ansøge om tvangsauktion hos fogedretten. Eksempel: Realkreditinstituttet sender rykker med 14 dages frist. Hvis debitor ikke betaler, kan tvangsauktion kræves. Realkreditinstituttet ansøger om tvangsauktion. Ansøgningen sendes til fogedretten.">
                                        <div class="option" data-option="Ejendommen sælges med det samme, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Debitor får 1 år til at betale, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Panthaver kan ansøge om tvangsauktion hos fogedretten"></div>
                                        <div class="option" data-option="Pantet ophæves automatisk, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvordan fordeles salgssummen ved tvangsauktion?"
                                        data-answer="1"
                                        data-explanation="Salgssummen fordeles efter prioritetsordenen. Realkreditinstitut får først dækning (1. prioritet), derefter banken (2. prioritet). Resten går til debitor eller andre kreditorer. Eksempel: Realkreditinstituttet får først 1,5 mio. kr., derefter får banken resten (0,5 mio. kr.), men taber 300.000 kr.">
                                        <div class="option" data-option="Lige mellem alle panthaver, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Efter prioritetsordenen - 1. prioritet får først, derefter 2. prioritet osv."></div>
                                        <div class="option" data-option="Den største panthaver får først, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Den mindste panthaver får først og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen, hvis bankpantebrev tinglyses før realkreditpantebrev ved en fejl?"
                                        data-answer="3"
                                        data-explanation="Hvis bankpantebrev tinglyses først ved fejl, bliver bankpantebrev 1. prioritet og realkreditpantebrev 2. prioritet. Ved tvangsauktion får banken først dækning, selvom realkreditinstituttet skulle have haft 1. prioritet. Realkreditinstituttet kan kræve erstatning af mægleren.">
                                        <div class="option" data-option="Ingen konsekvens, prioriteten justeres automatisk, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Begge pantebreve ophæves og skal overholdes, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Pantebrevene skal tinglyses igen og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Banken får 1. prioritet i stedet for realkredit, hvilket kan give erstatningsansvar"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad dækker et skadesløsbrev?"
                                        data-answer="0"
                                        data-explanation="Skadesløsbrev dækker alle gældsforhold mellem debitor og kreditor op til et maksimalt beløb. Det er meget fleksibelt for banken. Eksempel: Virksomhed pantsætter ejendom til banken med skadesløsbrev på 5 mio. kr. Dette dækker alle gældsforhold (kassekredit, banklån, kreditlinje) op til 5 mio. kr.">
                                        <div class="option"
                                             data-option="Alle gældsforhold mellem debitor og kreditor op til et maksimalt beløb"></div>
                                        <div class="option" data-option="Kun ét specifikt lån hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun realkreditlån, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun banklån, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er fordelene ved realkreditpantebrev sammenlignet med bankpantebrev?"
                                        data-answer="2"
                                        data-explanation="Realkreditpantebreve giver typisk lavere rente end bankpantebreve. De er den primære finansiering af boligkøb. Realkreditpantebreve tinglyses normalt som 1. prioritet, hvilket sikrer fuld dækning ved tvangsauktion.">
                                        <div class="option" data-option="Højere rente, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Mere fleksibelt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Lav rente og typisk 1. prioritet"></div>
                                        <div class="option" data-option="Kan genbruges, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der, hvis ejendommens værdi falder under pantbeløbet ved tvangsauktion?"
                                        data-answer="1"
                                        data-explanation="Hvis ejendommens værdi falder under pantbeløbet ved tvangsauktion, får panthaver ikke fuld dækning. Salgssummen fordeles efter prioritetsordenen. Første panthaver får først dækning, derefter anden panthaver osv. Hvis der ikke er nok penge, taber panthaver den del, der ikke kan dækkes.">
                                        <div class="option" data-option="Panthaver får stadig fuld dækning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Panthaver får ikke fuld dækning - taber den del, der ikke kan dækkes"></div>
                                        <div class="option" data-option="Ejendommen sælges ikke, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Pantet ophæves automatisk og kan anvendes i forskellige sammenhænge"></div>
                                   </div>
                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
