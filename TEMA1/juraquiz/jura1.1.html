                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er en paragraf (§)?"
                                        data-answer="1"
                                        data-explanation="En paragraf (§) er lovens grundenhed. En lov er delt op i nummererede stykker tekst. '§' er tegnet for paragraf. For eksempel: '§ 1. En aftale er bindende.'">
                                        <div class="option" data-option="En underopdeling af et stykke, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Lovens grundenhed - en nummereret del af en lovtekst"></div>
                                        <div class="option" data-option="En liste inde i et stykke, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="En lov, der ikke kan fraviges ved aftale"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem en præceptiv lov og en deklaratorisk lov?"
                                        data-answer="2"
                                        data-explanation="En præceptiv lov er en lov, der IKKE kan fraviges ved aftale (beskytter typisk den svage part). En deklaratorisk lov er en lov, der gælder, HVIS intet andet er aftalt - den kan fraviges. Eksempel på præceptiv lov: Kreditaftaleloven - banken kan ikke aftale, at du ikke har fortrydelsesret. Eksempel på deklaratorisk lov: Købeloven mellem virksomheder - man kan godt aftale 1 års reklamationsret i stedet for 2 år.">
                                        <div class="option" data-option="Der er ingen forskel, det er det samme begreb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Præceptiv lov kan fraviges, deklaratorisk lov kan ikke og skal overholdes"></div>
                                        <div class="option" data-option="Præceptiv lov kan IKKE fraviges ved aftale, deklaratorisk lov kan fraviges"></div>
                                        <div class="option" data-option="Præceptiv lov gælder kun for virksomheder, deklaratorisk lov gælder kun for private"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilken retskilde har højest vægt i Danmark?"
                                        data-answer="0"
                                        data-explanation="Lovgivning (love vedtaget af Folketinget) er den stærkeste retskilde og har højest vægt. Alle skal følge loven. Derefter kommer domme (retspraksis), så sædvane, og til sidst forholdets natur.">
                                        <div class="option" data-option="Lovgivning (love vedtaget af Folketinget)"></div>
                                        <div class="option" data-option="Domme (retspraksis) hvilket er standard praksis"></div>
                                        <div class="option" data-option="Sædvane, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Forholdets natur, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er retspraksis (domme)?"
                                        data-answer="1"
                                        data-explanation="Retspraksis er afgørelser fra domstolene, især Højesteret. Dommene viser, hvordan loven fortolkes i praksis. De har meget høj vægt og bruges til at forstå, hvordan loven anvendes i konkrete situationer. Eksempel: U 2018.553 V om erstatning for mangelfuld rådgivning.">
                                        <div class="option" data-option="Love vedtaget af Folketinget, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="Afgørelser fra domstolene, der viser hvordan loven fortolkes"></div>
                                        <div class="option" data-option="Uskrevne regler, der er blevet praksis over tid"></div>
                                        <div class="option" data-option="Hvad der er rimeligt og naturligt i situationen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er sædvane som retskilde?"
                                        data-answer="2"
                                        data-explanation="Sædvane er uskrevne regler, der er blevet praksis over tid. Det er 'sådan gør man i branchen'. Sædvane har middel vægt som retskilde. Eksempler: Kutymer for handel med værdipapirer, 'God skik' regler inden for forsikring.">
                                        <div class="option" data-option="Love vedtaget af Folketinget, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="Afgørelser fra domstolene og skal overholdes"></div>
                                        <div class="option" data-option="Uskrevne regler, der er blevet praksis over tid"></div>
                                        <div class="option" data-option="Hvad der er rimeligt og naturligt i situationen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ordlydsfortolkning?"
                                        data-answer="0"
                                        data-explanation="Ordlydsfortolkning er en af de fire fortolkningsmetoder. Den stiller spørgsmålet: Hvad står der ordret i loven? Man læser lovteksten bogstaveligt og analyserer ordene. Eksempel: I AFTL § 30 om svig spørger man: Hvad betyder 'svig'?">
                                        <div class="option" data-option="At læse hvad der står ordret i loven"></div>
                                        <div class="option" data-option="At se hvordan paragraffen hænger sammen med andre paragraffer"></div>
                                        <div class="option" data-option="At undersøge hvad lovgivers hensigt var"></div>
                                        <div class="option" data-option="At analysere formålet med reglen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er systematisk fortolkning?"
                                        data-answer="1"
                                        data-explanation="Systematisk fortolkning er en fortolkningsmetode, der stiller spørgsmålet: Hvordan hænger paragraffen sammen med andre paragraffer? Man ser på sammenhængen mellem forskellige regler i loven. Eksempel: AFTL § 30 (svig) er en svag ugyldighedsgrund, mens AFTL § 28 (vold) er stærk. Det betyder, at svig kun gælder, når modparten vidste besked (ond tro).">
                                        <div class="option" data-option="At læse hvad der står ordret i loven, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="At se hvordan paragraffen hænger sammen med andre paragraffer"></div>
                                        <div class="option" data-option="At undersøge hvad lovgivers hensigt var, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="At analysere formålet med reglen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er historisk fortolkning?"
                                        data-answer="2"
                                        data-explanation="Historisk fortolkning er en fortolkningsmetode, der stiller spørgsmålet: Hvad var lovgivers hensigt? Man undersøger forarbejderne (lovens forhistorie) for at forstå, hvad lovgiveren havde i tankerne. Eksempel: I forarbejderne til AFTL § 30 står, at svig skal beskytte mod bevidst vildledning - vildledningen skal være sket med vilje (forsæt).">
                                        <div class="option" data-option="At læse hvad der står ordret i loven, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="At se hvordan paragraffen hænger sammen med andre paragraffer"></div>
                                        <div class="option" data-option="At undersøge hvad lovgivers hensigt var (forarbejderne)"></div>
                                        <div class="option" data-option="At analysere formålet med reglen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er formålsfortolkning?"
                                        data-answer="3"
                                        data-explanation="Formålsfortolkning er en fortolkningsmetode, der stiller spørgsmålet: Hvad er formålet med reglen? Man analyserer, hvad reglen skal opnå, og fortolker den derefter. Eksempel: Formålet med AFTL § 30 om svig er at sikre redelig handel. Reglen skal derfor fortolkes så den beskytter den part, der er blevet snydt.">
                                        <div class="option" data-option="At læse hvad der står ordret i loven"></div>
                                        <div class="option" data-option="At se hvordan paragraffen hænger sammen med andre paragraffer"></div>
                                        <div class="option" data-option="At undersøge hvad lovgivers hensigt var"></div>
                                        <div class="option" data-option="At analysere formålet med reglen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er det første trin i den 5-trins model til juridisk argumentation?"
                                        data-answer="0"
                                        data-explanation="Den 5-trins model til juridisk argumentation starter med trin 1: Identificer problemet. Man skal først forstå, hvad det juridiske spørgsmål er. Eksempel: En kunde har investeret hele sin opsparing i højrisiko-aktier efter råd fra sin bank, men tabt alt. Kan kunden få erstatning?">
                                        <div class="option" data-option="Identificer problemet"></div>
                                        <div class="option" data-option="Find den relevante regel"></div>
                                        <div class="option" data-option="Anvend reglen på fakta (subsumption)"></div>
                                        <div class="option" data-option="Konklusion, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er subsumption i juridisk argumentation?"
                                        data-answer="2"
                                        data-explanation="Subsumption er trin 3 i den 5-trins model. Det betyder at anvende reglen på fakta - at sammenholde reglen med de konkrete omstændigheder i sagen. Man spørger: Passer fakta med reglen? Eksempel: Handlede rådgiveren uagtsomt? Ja: Kunden bad om 'sikker investering', men fik 'høj risiko'.">
                                        <div class="option" data-option="At identificere problemet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At finde den relevante regel, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="At anvende reglen på fakta - sammenholde reglen med de konkrete omstændigheder"></div>
                                        <div class="option" data-option="At nå en konklusion, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er bevisbyrde?"
                                        data-answer="1"
                                        data-explanation="Bevisbyrde er begrebet om, hvem der skal bevise hvad. Hovedreglen er: Den der påstår noget, skal bevise det. Eksempel: I en forsikringssag skal kunden bevise, at der er sket en skade, der er dækket af policen.">
                                        <div class="option" data-option="Hvem der skal betale erstatning, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="Hvem der skal bevise hvad - den der påstår noget, skal bevise det"></div>
                                        <div class="option" data-option="Hvem der har ret i en sag, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Hvem der skal betale retsgebyrer, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem god tro og ond tro?"
                                        data-answer="2"
                                        data-explanation="God tro betyder uvidende (uskyldig) - man vidste ikke, at noget var forkert. Ond tro betyder vidste eller burde vide - man vidste eller skulle have vidst, at noget var forkert. Eksempel: En køber af en lejlighed er i god tro om en gæld, hvis intet fremgik af tingbogen. Er i ond tro, hvis sælger sagde det.">
                                        <div class="option" data-option="God tro er altid bedre end ond tro, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Der er ingen forskel, det er det samme begreb"></div>
                                        <div class="option" data-option="God tro = uvidende (uskyldig), ond tro = vidste eller burde vide"></div>
                                        <div class="option" data-option="God tro = med vilje, ond tro = uagtsomt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forsæt?"
                                        data-answer="0"
                                        data-explanation="Forsæt betyder med vilje - en bevidst handling. For at straffe for forsikringssvindel (jf. Straffeloven § 279) kræves forsæt. Man skal vide, at man snyder. Forsæt er altså, når man handler bevidst og med vilje.">
                                        <div class="option" data-option="Med vilje - bevidst handling"></div>
                                        <div class="option" data-option="Ikke med vilje, men en fejl man burde have undgået"></div>
                                        <div class="option" data-option="Uvidende (uskyldig), hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="Vidste eller burde vide"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er uagtsomhed?"
                                        data-answer="1"
                                        data-explanation="Uagtsomhed betyder ikke med vilje, men en fejl man burde have undgået (culpa). Det er professionelt ansvar, når man ikke har handlet med forsæt, men alligevel har begået en fejl. Eksempel: En investeringsrådgiver glemte at spørge om kundens tidshorisont (jf. Lov om finansiel virksomhed § 43). Det er en uagtsom fejl.">
                                        <div class="option" data-option="Med vilje - bevidst handling, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ikke med vilje, men en fejl man burde have undgået (culpa)"></div>
                                        <div class="option" data-option="Uvidende (uskyldig), baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Vidste eller burde vide, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er condictio indebiti?"
                                        data-answer="2"
                                        data-explanation="Condictio indebiti er krav om tilbagebetaling af penge, der er betalt ved en fejl. Eksempel: Banken udbetaler 1 mio. kr. for meget ved en fejl. Banken kan kræve dem tilbage (medmindre modtageren var i god tro og har brugt dem rimeligt).">
                                        <div class="option" data-option="Krav om erstatning for skade, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="Krav om at opfylde en aftale, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Krav om tilbagebetaling af penge, der er betalt ved en fejl"></div>
                                        <div class="option" data-option="Krav om at annullere en kontrakt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er analogislutning?"
                                        data-answer="3"
                                        data-explanation="Analogislutning er at anvende en lovregel på et område, den ikke direkte gælder for, fordi det ligner. Man bruger regler fra ét område på et lignende område. Eksempel: Regler om 'køb' bruges ofte analogisk på 'bytte' af varer, da situationerne minder om hinanden.">
                                        <div class="option" data-option="At læse loven ordret, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="At se på lovens formål, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="At undersøge forarbejderne, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At anvende en lovregel på et område, den ikke direkte gælder for, fordi det ligner"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et præjudikat?"
                                        data-answer="0"
                                        data-explanation="Et præjudikat er en tidligere dom, der 'skaber ret' og følges i fremtidige sager. Det er især Højesteretsdomme, der bliver præjudikater. Eksempel: En Højesteretsdom om, at banker altid skal rådgive om særlige lånerisici, bliver et præjudikat, alle banker skal følge.">
                                        <div class="option" data-option="En tidligere dom, der 'skaber ret' og følges i fremtidige sager"></div>
                                        <div class="option" data-option="En lov vedtaget af Folketinget, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="En uskreven regel, der er blevet praksis, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="Hvad der er rimeligt i situationen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvor finder man danske love?"
                                        data-answer="1"
                                        data-explanation="Danske love findes på retsinformation.dk, som er den officielle database med alle danske love gratis. Her kan man søge efter og læse alle love vedtaget af Folketinget.">
                                        <div class="option" data-option="Karnov (kræver abonnement), hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="retsinformation.dk (alle danske love gratis)"></div>
                                        <div class="option" data-option="domstol.dk, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="finanstilsynet.dk, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad betyder 'stk.' i en lovtekst?"
                                        data-answer="2"
                                        data-explanation="'stk.' står for stykke og er en underopdeling af en paragraf. Hvis en paragraf er lang, deles den i stk. 1, stk. 2 osv. Eksempel: '§ 1, stk. 2. Hvis man er fuld, gælder aftalen måske ikke.'">
                                        <div class="option" data-option="Paragraf, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="Litra (nummer/bogstav), hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Stykke - en underopdeling af en paragraf"></div>
                                        <div class="option" data-option="En liste inde i et stykke, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er litra (nr./bogstav) i en lovtekst?"
                                        data-answer="3"
                                        data-explanation="Litra (nr./bogstav) er en liste inde i et stykke. Det kan være 'nr. 1', 'nr. 2' eller 'litra a', 'litra b'. Eksempel: '§ 5, stk. 1, nr. 3' betyder: Paragraf 5, stykke 1, nummer 3 på listen.">
                                        <div class="option" data-option="Paragraf, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="Stykke, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="En lov, der ikke kan fraviges, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option" data-option="En liste inde i et stykke (fx nr. 1, nr. 2 eller litra a, litra b)"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'forholdets natur' som retskilde?"
                                        data-answer="0"
                                        data-explanation="Forholdets natur er hvad der er rimeligt og naturligt i situationen. Det bruges når loven er tavs (ikke siger noget om situationen). Det har lavest vægt som retskilde. Eksempel: 'Det er naturligt, at en ejendomsmægler undersøger servitutter på en ejendom før salg.'">
                                        <div class="option" data-option="Hvad der er rimeligt og naturligt i situationen - bruges når loven er tavs"></div>
                                        <div class="option" data-option="Love vedtaget af Folketinget hvilket er standard praksis"></div>
