<body data-formål="Forståelse af grundbegreber i Købeloven, herunder hvad et køb er, handelskøb vs. civilkøb, og forbrugerkøb." data-forudsætning-url="https://jura.tepedu.dk/kapitel3.html" data-forudsætning-text="Købeloven - Kapitel 3" data-forudsætning="">
     <header> <a href="index.html"
             target="_blank"><img src="tepedulogo.svg"
                    alt="Logo"
                    width="8%"></a>
          <h2>Quiz Købeloven - Grundbegreber</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Købeloven: Grundbegreber
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er definitionen på 'løsøre' i Købeloven?"
                                        data-answer="1"
                                        data-explanation="Løsøre er fysiske, rørlige ting, der kan flyttes. Det er ikke fast ejendom. Eksempler er: En bil, en computer, en stabel aktier (hvis fysiske), kontormøbler.">
                                        <div class="option" data-option="Fast ejendom som huse og bygninger, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Fysiske, rørlige ting, der kan flyttes (ikke fast ejendom)"></div>
                                        <div class="option" data-option="Kun penge og værdipapirer, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun biler og transportmidler, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et handelskøb?"
                                        data-answer="2"
                                        data-explanation="Et handelskøb er et køb mellem to erhvervsdrivende (Business-to-Business / B2B). Eksempel: Jyske Bank køber en ny server af Dell. Begge handler i erhverv.">
                                        <div class="option" data-option="Et køb mellem to private personer"></div>
                                        <div class="option"
                                             data-option="Et køb hvor køber er privat og sælger er erhvervsdrivende"></div>
                                        <div class="option"
                                             data-option="Et køb mellem to erhvervsdrivende (B2B)"></div>
                                        <div class="option" data-option="Et køb af varer til videresalg"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et forbrugerkøb?"
                                        data-answer="1"
                                        data-explanation="Forbrugerkøb er køb hvor køberen er en forbruger (fysisk person, der handler uden for erhvervsmæssig eller kommerciel virksomhed) og sælgeren er erhvervsdrivende (Business-to-Consumer / B2C). Eksempel: Du køber en ny iPhone i Elgiganten.">
                                        <div class="option" data-option="Et køb mellem to erhvervsdrivende, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Et køb hvor køber er privat (forbruger) og sælger er erhvervsdrivende (B2C)"></div>
                                        <div class="option" data-option="Et køb mellem to private personer, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Et køb af varer til erhvervsmæssig brug og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er en 'mangel' i Købeloven?"
                                        data-answer="3"
                                        data-explanation="En mangel er når varen ikke lever op til det aftalte (fejl, skader, forsinkelse). Eksempel: Den nye firmabil vil ikke starte, eller aktierne leveres 2 dage for sent.">
                                        <div class="option" data-option="Når prisen er for høj, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Når leveringstiden er for lang, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Når varen er brugt i stedet for ny, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Når varen ikke lever op til det aftalte (fejl, skader, forsinkelse)"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad forstås ved 'køb' i Købeloven?"
                                        data-answer="0"
                                        data-explanation="Med 'køb' forstås traditionelt en aftale mellem sælger og køber om overdragelse af ejendomsretten af et formuegode (løsøre) mod et vederlag i penge. Det skal være en gensidigt bebyrdende købsaftale.">
                                        <div class="option"
                                             data-option="En aftale om overdragelse af ejendomsretten af et formuegode (løsøre) mod et vederlag i penge"></div>
                                        <div class="option" data-option="En aftale om leje af en vare hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="En aftale om lån af en vare, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="En aftale om køb af fast ejendom, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem 'køb' og 'lån til brug'?"
                                        data-answer="2"
                                        data-explanation="Modsat 'lån til brug', som er en aftale mellem långiver og låntager om vederlagsfri brug af en ting, hvor selve tingen skal leveres tilbage til långiver, når forholdet ophører (fx leasing af en bil eller leje af et løbehjul), er køb en overdragelse af ejendomsretten mod vederlag.">
                                        <div class="option" data-option="Der er ingen forskel, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Køb er billigere end lån til brug, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Ved køb overdrages ejendomsretten mod vederlag, ved lån til brug skal tingen leveres tilbage"></div>
                                        <div class="option" data-option="Køb er kun for erhvervsdrivende, lån til brug er for private, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad betyder det, at en købsaftale skal være 'gensidigt bebyrdende'?"
                                        data-answer="1"
                                        data-explanation="En gensidigt bebyrdende købsaftale betyder, at både køberens og sælgerens ydelse forholder sig som vederlag for modydelsen. Sælgeren leverer varen, køberen betaler prisen.">
                                        <div class="option" data-option="At begge parter skal være enige om alt, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="At både køberens og sælgerens ydelse forholder sig som vederlag for modydelsen"></div>
                                        <div class="option" data-option="At begge parter skal være erhvervsdrivende, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At købet skal være skriftligt og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad kan sælgerens ydelse omfatte ved et køb?"
                                        data-answer="3"
                                        data-explanation="Sælgerens ydelse er et formuegode. Der er hyppigst tale om overdragelse af ejendomsretten til et løsøre (fx en hundehvalp), men der kan også være tale om overdragelse af fordringsrettigheder (fx aktier, obligationer), ophavsrettigheder eller andre immaterielle rettigheder, goodwill, valuta, eller overdragelse af en begrænset rettighed.">
                                        <div class="option" data-option="Kun fysiske genstande, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun løsøre, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun aktier og obligationer, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Løsøre, fordringsrettigheder, immaterielle rettigheder, goodwill, valuta m.m."></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvor gælder Købeloven?"
                                        data-answer="0"
                                        data-explanation="Hovedreglen er, at købeloven gælder for alle køb, der bliver indgået mellem sælger og køber. Undtagelse er køb af fast ejendom og tjenesteydelser (dog analog anvendelse) eller ved opførelse af bygning eller andet anlæg på fast ejendom, samt internationale køb (CISG).">
                                        <div class="option"
                                             data-option="For alle køb af løsøre mellem sælger og køber (med undtagelse af fast ejendom og internationale køb)"></div>
                                        <div class="option" data-option="Kun for handelskøb mellem erhvervsdrivende hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kun for forbrugerkøb, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                        <div class="option" data-option="Kun for køb af fast ejendom, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et handelskøb ifølge KBL § 4?"
                                        data-answer="2"
                                        data-explanation="Et køb, der indgås mellem handlende, der handler i eller for deres bedrift, jf. KBL § 4, stk. 1 er et handelskøb. Dvs. et køb, hvor både køber og sælger er erhvervsdrivende, og hvor købet indgås i forbindelse med deres virksomhed eller deres erhvervsmæssige aktiviteter.">
                                        <div class="option" data-option="Et køb mellem to private personer, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Et køb hvor kun sælgeren er erhvervsdrivende"></div>
                                        <div class="option"
                                             data-option="Et køb mellem handlende, der handler i eller for deres bedrift"></div>
                                        <div class="option" data-option="Et køb af varer til videresalg, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et civilkøb?"
                                        data-answer="1"
                                        data-explanation="Et civilkøb er handel mellem to private fx i Den Blå Avis. Det er karakteristisk for de særlige regler om handelskøb, at parternes forpligtelser skærpes i forhold til, hvad der gælder i civile køb.">
                                        <div class="option" data-option="Et køb mellem to erhvervsdrivende"></div>
                                        <div class="option"
                                             data-option="Handel mellem to private (fx i Den Blå Avis)"></div>
                                        <div class="option" data-option="Et køb hvor køber er forbruger, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Et køb af fast ejendom, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad betyder det, at Købeloven er 'deklaratorisk' ved handelskøb?"
                                        data-answer="3"
                                        data-explanation="Hovedreglen er, at købeloven er deklaratorisk i handelskøb, hvor der er en købsaftale mellem to erhvervsdrivende, dvs., at købeloven kan fraviges ved aftale og må vige for handelsbrug eller sædvane.">
                                        <div class="option" data-option="At den altid skal følges, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At den kun gælder for forbrugerkøb, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At den kun gælder for civile køb, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="At den kan fraviges ved aftale og må vige for handelsbrug eller sædvane"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på sædvane (børskutymer) i finanssektoren?"
                                        data-answer="0"
                                        data-explanation="Inden for handel med værdipapirer og valuta gælder meget stærke sædvaner (børskutymer). F.eks. er der kutyme for, at en handel er bindende mundtligt (telefonisk) straks, og at levering (afvikling) sker efter faste frister (fx T+2 dage). Disse kutymer går forud for købelovens almindelige regler om leveringstid.">
                                        <div class="option"
                                             data-option="At en handel er bindende mundtligt straks, og levering sker efter faste frister (fx T+2 dage)"></div>
                                        <div class="option" data-option="At alle handler skal være skriftlige hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At levering altid skal ske samme dag, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At prisen altid skal fastsættes ved handel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Kan Købeloven fraviges ved forbrugerkøb?"
                                        data-answer="2"
                                        data-explanation="Købeloven kan ikke fraviges i forbrugerkøb, medmindre fravigelsen er til forbrugerens fordel. Dvs., at forbrugeren bliver stillet bedre end, hvad der følger af købelovens ufravigelige forbrugerkøbsregler, fx at der gives forbrugeren 3 års reklamationsret imod den 2-årige lovpligtige reklamationsret.">
                                        <div class="option" data-option="Ja, altid, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Ja, hvis begge parter er enige, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Nej, medmindre fravigelsen er til forbrugerens fordel"></div>
                                        <div class="option" data-option="Ja, hvis det er skriftligt aftalt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvem er en 'forbruger' i forbrugerkøb?"
                                        data-answer="1"
                                        data-explanation="Forbrugerkøb er køb, hvor køberen er en forbruger, dvs. en fysisk person, der handler uden for erhvervsmæssig eller kommerciel virksomhed. Sælgeren kan være både erhvervsdrivende og privatperson.">
                                        <div class="option" data-option="En erhvervsdrivende person, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="En fysisk person, der handler uden for erhvervsmæssig eller kommerciel virksomhed"></div>
                                        <div class="option" data-option="En virksomhed, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="En bank eller finansiel institution, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Er landbrug eller fiskeri at betragte som et handelskøb?"
                                        data-answer="3"
                                        data-explanation="Der skal være tale om en egentlig handelsvirksomhed, derfor er landbrug eller fiskeri ikke at betragte som et handelskøb.">
                                        <div class="option" data-option="Ja, altid, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Ja, hvis det er mellem to erhvervsdrivende, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun hvis det er til videresalg, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Nej, landbrug eller fiskeri er ikke at betragte som et handelskøb"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Skal det købte ved et handelskøb anvendes til videresalg?"
                                        data-answer="2"
                                        data-explanation="Det er ikke en betingelse i købeloven, at det købte skal anvendes til videresalg. Køb af inventar, kontormøbler, kontorrekvisitter, biler til brug for transport af varer eller kundebesøg udgør fx handelskøb, når køberen og sælgeren er handlende.">
                                        <div class="option" data-option="Ja, altid, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Ja, hvis det er mellem to erhvervsdrivende"></div>
                                        <div class="option"
                                             data-option="Nej, det er ikke en betingelse"></div>
                                        <div class="option" data-option="Kun hvis det er aftalt"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Gælder Købeloven også for brugte ting?"
                                        data-answer="0"
                                        data-explanation="Købelovens regler gælder også, når der købes 'brugte ting' af sælgeren.">
                                        <div class="option"
                                             data-option="Ja, købelovens regler gælder også for brugte ting"></div>
                                        <div class="option" data-option="Nej, kun for nye varer hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kun hvis det er aftalt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun ved handelskøb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er karakteristisk for de særlige regler om handelskøb?"
                                        data-answer="1"
                                        data-explanation="Det er karakteristisk for de særlige regler om handelskøb, at parternes forpligtelser skærpes i forhold til, hvad der gælder i civile køb (handel mellem to private fx i Den Blå Avis; kaldet et civilkøb).">
                                        <div class="option" data-option="At parternes forpligtelser er mindre end ved civilkøb"></div>
                                        <div class="option"
                                             data-option="At parternes forpligtelser skærpes i forhold til civile køb"></div>
                                        <div class="option" data-option="At der er færre regler end ved civilkøb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At det kun gælder for store beløb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>
                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
