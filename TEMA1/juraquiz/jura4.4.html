<body data-formål="Forståelse af forholdet mellem forsikring og erstatningsansvar efter Erstatningsansvarsloven §§ 19-22, herunder ansvarsfrihed ved forsikring, selvforsikrede og forsikringsselskabets regres." data-forudsætning-url="https://jura.tepedu.dk/kapitel4.html" data-forudsætning-text="Online-bog Jura Kapitel 4: Erstatning" data-forudsætning="">

     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Jura: Erstatning - Forsikring og Erstatningsansvar (EAL §§ 19-22)
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad handler EAL § 19 om?"
                                        data-answer="1"
                                        data-explanation="EAL § 19 handler om ansvarsfrihed ved forsikring: Hvis skaden er dækket af tingsforsikring eller driftstabsforsikring, er skadevolder ansvarsfri. Dog ikke ved forsæt, grov uagtsomhed eller erhvervsmæssig virksomhed.">
                                        <div class="option" data-option="Culpa-reglen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Ansvarsfrihed ved forsikring - men ikke ved forsæt, grov uagtsomhed eller erhverv"></div>
                                        <div class="option" data-option="Personskadeerstatning, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Principalansvar, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår er skadevolder ansvarsfri efter EAL § 19?"
                                        data-answer="2"
                                        data-explanation="Skadevolder er ansvarsfri efter EAL § 19, hvis skaden er dækket af tingsforsikring eller driftstabsforsikring. Men ansvarsfrihed gælder IKKE ved forsæt, grov uagtsomhed eller erhvervsmæssig virksomhed.">
                                        <div class="option" data-option="Altid når der er forsikring, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun ved forsæt, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Når skaden er dækket af forsikring, men IKKE ved forsæt, grov uagtsomhed eller erhverv"></div>
                                        <div class="option" data-option="Kun ved simpel uagtsomhed, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad siger EAL § 19 stk. 3 om arbejdstagere?"
                                        data-answer="0"
                                        data-explanation="EAL § 19 stk. 3 siger at arbejdstagere er ansvarsfri, medmindre skaden er forvoldt med forsæt eller grov uagtsomhed. Ved simpel uagtsomhed er arbejdstagere ansvarsfri, hvis skaden er dækket af forsikring.">
                                        <div class="option"
                                             data-option="Arbejdstagere er ansvarsfri, medmindre skaden er forvoldt med forsæt eller grov uagtsomhed"></div>
                                        <div class="option" data-option="Arbejdstagere hæfter altid, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Arbejdstagere hæfter kun ved forsæt, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Arbejdstagere hæfter kun ved grov uagtsomhed og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på ansvarsfrihed efter EAL § 19?"
                                        data-answer="3"
                                        data-explanation="Et eksempel er hvis en bankassistent taber ved et uheld en bærbar computer på gulvet. Skaden er dækket af løsøreforsikringen, så bankassistenten skal ikke betale noget (ansvarsfri). Men hvis bankassistenten havde kastet computeren med vilje (forsæt), ville vedkommende ikke være ansvarsfri.">
                                        <div class="option" data-option="En bankmand snyder bevidst en kunde, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="En rådgiver glemmer at tjekke RKI, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="En ejendomsmægler fortier fejl, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Bankassistent taber ved uheld en computer - skaden dækket af forsikring → ansvarsfri"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 20 om?"
                                        data-answer="1"
                                        data-explanation="EAL § 20 handler om selvforsikrede: Offentlige myndigheder anses som selvforsikrede, selvom forsikring ikke er tegnet. Stat og kommuner anses som selvforsikrede ved erstatningssager.">
                                        <div class="option" data-option="Ansvarsfrihed ved forsikring, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option"
                                             data-option="Selvforsikrede - offentlige myndigheder behandles som selvforsikrede"></div>
                                        <div class="option" data-option="Forsikringsselskabets regres, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Lempelse, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvem behandles som selvforsikrede efter EAL § 20?"
                                        data-answer="2"
                                        data-explanation="Offentlige myndigheder behandles som selvforsikrede efter EAL § 20. Det betyder at stat og kommuner anses som selvforsikrede ved erstatningssager, selvom de ikke har tegnet forsikring. Finanstilsynet behandles også som selvforsikret.">
                                        <div class="option" data-option="Private virksomheder, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Forsikringsselskaber, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Offentlige myndigheder (stat og kommuner)"></div>
                                        <div class="option" data-option="Banker, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler EAL § 22 om?"
                                        data-answer="0"
                                        data-explanation="EAL § 22 handler om forsikringsselskabets regres: Forsikringsselskab, der har udbetalt erstatning, har regres mod skadevolder (hvis skadevolder ikke var ansvarsfri). Dog ikke ved livs-, ulykkes-, syge- eller andre personforsikringer.">
                                        <div class="option"
                                             data-option="Forsikringsselskabets regres mod skadevolder - men ikke ved personforsikringer"></div>
                                        <div class="option" data-option="Ansvarsfrihed ved forsikring hvilket er standard praksis"></div>
                                        <div class="option" data-option="Selvforsikrede, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Lempelse, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'regres' i forbindelse med EAL § 22?"
                                        data-answer="3"
                                        data-explanation="Regres betyder at forsikringsselskabet, der har udbetalt erstatning til skadelidte, kan kræve pengene tilbage fra skadevolderen (hvis skadevolder ikke var ansvarsfri). Dette er typisk ved forsæt eller grov uagtsomhed.">
                                        <div class="option" data-option="At skadevolder er ansvarsfri, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="At forsikringsselskabet betaler erstatning, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="At skadelidte får erstatning, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option"
                                             data-option="At forsikringsselskabet kan kræve pengene tilbage fra skadevolderen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår har forsikringsselskabet IKKE regres efter EAL § 22?"
                                        data-answer="1"
                                        data-explanation="Forsikringsselskabet har IKKE regres ved livs-, ulykkes-, syge- eller andre personforsikringer efter EAL § 22 stk. 2. Dette betyder at forsikringsselskabet ikke kan kræve pengene tilbage fra den forsikrede ved disse typer forsikringer.">
                                        <div class="option" data-option="Ved tingsforsikring, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Ved livs-, ulykkes-, syge- eller andre personforsikringer"></div>
                                        <div class="option" data-option="Ved driftstabsforsikring, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ved ansvarsforsikring og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på regres efter EAL § 22?"
                                        data-answer="2"
                                        data-explanation="Et eksempel er hvis en ejendomsmægler glemmer bevidst (forsæt) at oplyse om en stor skade. Mæglerens ansvarsforsikring betaler først kunden, men kræver derefter pengene tilbage fra mægleren (regres), fordi han handlede med forsæt.">
                                        <div class="option" data-option="Forsikringsselskabet betaler erstatning, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option" data-option="Skadevolder er ansvarsfri, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option"
                                             data-option="Ejendomsmægler handler med forsæt → forsikring betaler kunden → kræver pengene tilbage fra mægleren (regres)"></div>
                                        <div class="option" data-option="Skadelidte får erstatning, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der, hvis en bankmedarbejder laver simpel fejl dækket af forsikring?"
                                        data-answer="0"
                                        data-explanation="Hvis en bankmedarbejder laver simpel fejl dækket af forsikring, er medarbejderen ansvarsfri efter EAL § 19 stk. 3. Forsikringsselskabet betaler erstatning til skadelidte, og medarbejderen skal ikke betale noget.">
                                        <div class="option"
                                             data-option="Medarbejderen er ansvarsfri - forsikring betaler"></div>
                                        <div class="option" data-option="Medarbejderen hæfter fuldt ud hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kun banken hæfter, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="Ingen hæfter, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad sker der, hvis en bankmedarbejder handler med grov uagtsomhed og skaden er dækket af forsikring?"
                                        data-answer="3"
                                        data-explanation="Hvis en bankmedarbejder handler med grov uagtsomhed, er vedkommende IKKE ansvarsfri efter EAL § 19 stk. 2. Forsikringsselskabet kan betale erstatning til skadelidte, men kan derefter søge regres mod medarbejderen efter EAL § 22.">
                                        <div class="option" data-option="Medarbejderen er ansvarsfri, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option" data-option="Kun forsikringsselskabet hæfter og skal overholdes"></div>
                                        <div class="option" data-option="Ingen hæfter og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Medarbejderen er IKKE ansvarsfri - forsikring kan søge regres"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem EAL § 19 og EAL § 22?"
                                        data-answer="1"
                                        data-explanation="EAL § 19 handler om ansvarsfrihed ved forsikring - når skadevolder er ansvarsfri, hvis skaden er dækket af forsikring. EAL § 22 handler om forsikringsselskabets regres - når forsikringsselskabet kan kræve pengene tilbage fra skadevolderen efter at have udbetalt erstatning.">
                                        <div class="option" data-option="Der er ingen forskel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="§ 19 handler om ansvarsfrihed, § 22 handler om forsikringsselskabets regres"></div>
                                        <div class="option" data-option="§ 19 handler om regres, § 22 handler om ansvarsfrihed"></div>
                                        <div class="option" data-option="Begge handler om det samme, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'tingsforsikring' i forbindelse med EAL § 19?"
                                        data-answer="2"
                                        data-explanation="Tingsforsikring er forsikring der dækker skader på ting (fx løsøreforsikring, brandforsikring). Hvis skaden på en ting er dækket af tingsforsikring, er skadevolder ansvarsfri efter EAL § 19 (medmindre der er forsæt, grov uagtsomhed eller erhverv).">
                                        <div class="option" data-option="Forsikring mod personskade, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Forsikring mod tabt arbejdsfortjeneste, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Forsikring der dækker skader på ting (fx løsøre, bygninger)"></div>
                                        <div class="option" data-option="Forsikring mod erhvervsevnetab, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'driftstabsforsikring' i forbindelse med EAL § 19?"
                                        data-answer="0"
                                        data-explanation="Driftstabsforsikring er forsikring der dækker tab ved driftsafbrydelse (fx hvis en virksomhed må lukke midlertidigt pga. skade). Hvis skaden er dækket af driftstabsforsikring, er skadevolder ansvarsfri efter EAL § 19 (medmindre der er forsæt, grov uagtsomhed eller erhverv).">
                                        <div class="option"
                                             data-option="Forsikring der dækker tab ved driftsafbrydelse"></div>
                                        <div class="option" data-option="Forsikring mod personskade hvilket er standard praksis"></div>
                                        <div class="option" data-option="Forsikring mod tingsskade, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Forsikring mod erhvervsevnetab, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
