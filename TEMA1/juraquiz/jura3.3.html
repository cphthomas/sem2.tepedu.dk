<body data-formål="Forståelse af mangler ved varen, reklamationsret, afhjælpning og omlevering i Købeloven." data-forudsætning-url="https://jura.tepedu.dk/kapitel3.html" data-forudsætning-text="Købeloven - Kapitel 3" data-forudsætning="">

          <h2>Quiz Købeloven - Mangler og Reklamation</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Købeloven: Mangler og Reklamation
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvornår er der tale om en mangel ved varen ifølge KBL § 17?"
                                        data-answer="3"
                                        data-explanation="Der er tale om en mangel, når: Varen ikke svarer til det, der er aftalt (fx forkert model, forkert størrelse), varen ikke har de egenskaber, som sælgeren har oplyst, varen ikke er egnet til det formål, som den normalt bruges til, eller varen ikke svarer til det, som køberen med rimelighed kunne forvente.">
                                        <div class="option" data-option="Kun når varen er defekt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun når varen ikke svarer til det aftalte, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun når varen ikke har de oplyste egenskaber, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Når varen ikke svarer til det aftalte, mangler oplyste egenskaber, ikke er egnet til formålet, eller ikke svarer til forventninger"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er reklamationsfristen ved handelskøb ifølge KBL § 51 og § 54?"
                                        data-answer="0"
                                        data-explanation="Ved handelskøb skal køberen reklamere inden for 2 år efter levering, jf. KBL § 51 og § 54. Denne frist kan fraviges ved aftale, men kun til køberens fordel.">
                                        <div class="option"
                                             data-option="2 år efter levering"></div>
                                        <div class="option"
                                             data-option="1 år efter levering"></div>
                                        <div class="option"
                                             data-option="6 måneder efter levering"></div>
                                        <div class="option"
                                             data-option="3 år efter levering"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er reklamationsfristen ved forbrugerkøb ifølge KBL § 83?"
                                        data-answer="1"
                                        data-explanation="Ved forbrugerkøb har forbrugeren ret til at reklamere inden for 2 år efter levering, jf. KBL § 83, stk. 1. Denne ret kan ikke fraviges til forbrugerens ulempe.">
                                        <div class="option" data-option="1 år efter levering, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="2 år efter levering (ufravigelig)"></div>
                                        <div class="option" data-option="6 måneder efter levering"></div>
                                        <div class="option" data-option="3 år efter levering, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvordan skal man reklamere ifølge KBL § 21?"
                                        data-answer="2"
                                        data-explanation="Køberen skal reklamere inden for rimelig tid efter, at manglen er opdaget, jf. KBL § 21. Ved handelskøb er reklamationsfristen skærpet, og køberen skal reklamere hurtigere. Reklamationen skal være tydelig og angive, hvilken mangel der er tale om. Det er tilstrækkeligt at kontakte sælgeren og oplyse om manglen.">
                                        <div class="option" data-option="Kun skriftligt, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun mundtligt, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Inden for rimelig tid efter opdagelse, tydelig og angivende manglen"></div>
                                        <div class="option" data-option="Kun gennem advokat, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er sælgerens ret ved reklamation ifølge KBL § 23?"
                                        data-answer="1"
                                        data-explanation="Ifølge KBL § 23 har sælgeren ret til at afhjælpe manglen eller levere en ny vare. Køberen kan ikke umiddelbart kræve pengene tilbage. Køberen skal give sælgeren rimelig tid til at afhjælpe manglen.">
                                        <div class="option" data-option="At nægte at rette fejlen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At afhjælpe manglen eller levere en ny vare"></div>
                                        <div class="option" data-option="At kræve betaling med det samme"></div>
                                        <div class="option" data-option="At kræve erstatning fra køberen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad kan køberen gøre, hvis sælgeren ikke afhjælper manglen inden for rimelig tid ifølge KBL § 24?"
                                        data-answer="3"
                                        data-explanation="Hvis sælgeren ikke afhjælper manglen inden for rimelig tid, kan køberen kræve prisafslag eller ophæve købet, jf. KBL § 24. Køberen kan også kræve erstatning for tab.">
                                        <div class="option" data-option="Kun kræve prisafslag, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun ophæve købet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun kræve erstatning, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option"
                                             data-option="Kræve prisafslag eller ophæve købet, samt erstatning"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Kan køberen umiddelbart kræve pengene tilbage ved en mangel?"
                                        data-answer="2"
                                        data-explanation="Nej, køberen kan ikke umiddelbart kræve pengene tilbage. Sælgeren har ret til at afhjælpe manglen eller levere en ny vare først, jf. KBL § 23. Først hvis sælgeren ikke afhjælper manglen inden for rimelig tid, kan køberen ophæve købet og kræve pengene tilbage, jf. KBL § 24.">
                                        <div class="option" data-option="Ja, altid, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Ja, hvis det er handelskøb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Nej, sælgeren har ret til afhjælpning først"></div>
                                        <div class="option" data-option="Kun hvis det er forbrugerkøb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på en mangel ved varen?"
                                        data-answer="0"
                                        data-explanation="Eksempel: En bank køber en printer, der skulle kunne håndtere 10.000 sider om måneden, men den kan kun håndtere 5.000. Dette er en mangel, da varen ikke lever op til aftalen. Et andet eksempel: En bank køber software til kreditvurdering, men softwaren kan ikke håndtere danske CPR-numre, selvom sælgeren har oplyst, at den kan.">
                                        <div class="option"
                                             data-option="En printer der kun kan håndtere 5.000 sider om måneden, når der var aftalt 10.000"></div>
                                        <div class="option" data-option="En printer der er dyrere end forventet hvilket er standard praksis"></div>
                                        <div class="option" data-option="En printer der leveres 1 dag for sent, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="En printer der ikke er den samme farve som bestilt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem reklamationsfristen ved handelskøb og forbrugerkøb?"
                                        data-answer="1"
                                        data-explanation="Ved handelskøb er reklamationsfristen 2 år, men kan fraviges ved aftale (kun til køberens fordel). Ved forbrugerkøb er fristen også 2 år, men kan ikke fraviges til forbrugerens ulempe. Ved handelskøb skal der reklameres hurtigere efter opdagelse af manglen (typisk 1-2 uger).">
                                        <div class="option" data-option="Handelskøb har længere frist end forbrugerkøb, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Begge har 2 år, men ved handelskøb kan fristen fraviges, ved forbrugerkøb ikke til forbrugerens ulempe"></div>
                                        <div class="option" data-option="Forbrugerkøb har længere frist end handelskøb, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Der er ingen forskel, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad betyder 'afhjælpning' ifølge KBL § 23?"
                                        data-answer="3"
                                        data-explanation="Afhjælpning betyder, at sælgeren reparerer varen eller retter fejlen. Sælgeren har ret til at afhjælpe manglen eller levere en ny vare (omlevering). Køberen skal give sælgeren rimelig tid til at afhjælpe manglen.">
                                        <div class="option" data-option="At køberen betaler for reparationen"></div>
                                        <div class="option" data-option="At købet ophæves, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At køberen får prisafslag, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At sælgeren reparerer varen eller retter fejlen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad betyder 'omlevering' ifølge KBL § 23?"
                                        data-answer="0"
                                        data-explanation="Omlevering betyder, at sælgeren leverer en ny vare i stedet for den mangelfulde. Sælgeren har ret til at afhjælpe manglen eller levere en ny vare. Køberen skal give sælgeren rimelig tid til at afhjælpe manglen.">
                                        <div class="option"
                                             data-option="At sælgeren leverer en ny vare i stedet for den mangelfulde"></div>
                                        <div class="option" data-option="At køberen returnerer varen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At sælgeren reparerer varen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At købet ophæves og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'rimelig tid' til afhjælpning?"
                                        data-answer="2"
                                        data-explanation="Rimelig tid til afhjælpning afhænger af omstændighederne, fx typen af mangel og kompleksiteten af reparationen. Typisk er det 2-4 uger, men det kan variere. Hvis sælgeren ikke afhjælper manglen inden for rimelig tid, kan køberen kræve prisafslag eller ophæve købet.">
                                        <div class="option" data-option="Altid 1 uge, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Altid 1 måned, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Afhænger af omstændighederne, typisk 2-4 uger"></div>
                                        <div class="option" data-option="Altid 6 måneder, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er et eksempel på, hvornår der er tale om en mangel ved software?"
                                        data-answer="1"
                                        data-explanation="Eksempel: En bank køber software til kreditvurdering, men softwaren kan ikke håndtere danske CPR-numre, selvom sælgeren har oplyst, at den kan. Dette er en mangel, da varen ikke har de egenskaber, som sælgeren har oplyst.">
                                        <div class="option" data-option="Softwaren er dyrere end forventet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Softwaren kan ikke håndtere danske CPR-numre, selvom sælgeren har oplyst det"></div>
                                        <div class="option" data-option="Softwaren leveres 1 dag for sent, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Softwaren har en anden farve end forventet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Kan reklamationsfristen ved handelskøb fraviges?"
                                        data-answer="0"
                                        data-explanation="Ja, reklamationsfristen ved handelskøb kan fraviges ved aftale, men kun til køberens fordel, jf. KBL § 54. Det betyder, at man kan aftale en længere frist, men ikke en kortere frist end 2 år, medmindre det er til køberens fordel.">
                                        <div class="option"
                                             data-option="Ja, men kun til køberens fordel"></div>
                                        <div class="option" data-option="Nej, aldrig hvilket er standard praksis"></div>
                                        <div class="option" data-option="Ja, altid, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun hvis begge parter er enige"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Kan reklamationsfristen ved forbrugerkøb fraviges?"
                                        data-answer="3"
                                        data-explanation="Nej, reklamationsfristen ved forbrugerkøb kan ikke fraviges til forbrugerens ulempe, jf. KBL § 83. Forbrugerkøbsreglerne er ufravigelige til forbrugerens fordel, hvilket betyder, at sælgeren ikke kan aftale sig ud af de beskyttelsesregler, der findes i købeloven.">
                                        <div class="option" data-option="Ja, hvis begge parter er enige"></div>
                                        <div class="option" data-option="Ja, altid og skal overholdes"></div>
                                        <div class="option"
                                             data-option="Kun hvis det er skriftligt aftalt"></div>
                                        <div class="option"
                                             data-option="Nej, ikke til forbrugerens ulempe"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal køberen gøre, hvis en mangel opdages ved handelskøb?"
                                        data-answer="2"
                                        data-explanation="Ved handelskøb skal køberen reklamere hurtigt efter opdagelse af manglen (typisk inden for 1-2 uger), jf. KBL § 21. Reklamationen skal være tydelig og angive, hvilken mangel der er tale om. Køberen skal give sælgeren mulighed for afhjælpning først.">
                                        <div class="option" data-option="Umiddelbart kræve pengene tilbage, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Vente og se om problemet løser sig selv og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Reklamere hurtigt (typisk inden for 1-2 uger) og give sælgeren mulighed for afhjælpning"></div>
                                        <div class="option" data-option="Kun kontakte sælgeren hvis problemet er alvorligt og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem afhjælpning og omlevering?"
                                        data-answer="1"
                                        data-explanation="Afhjælpning betyder, at sælgeren reparerer varen eller retter fejlen. Omlevering betyder, at sælgeren leverer en ny vare i stedet for den mangelfulde. Begge er muligheder for sælgeren ifølge KBL § 23.">
                                        <div class="option" data-option="Der er ingen forskel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Afhjælpning er reparation, omlevering er levering af ny vare"></div>
                                        <div class="option" data-option="Afhjælpning er billigere end omlevering, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Omlevering er kun ved handelskøb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>
                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
