<body data-formål="Forståelse af Købelovens vigtigste paragraffer for finans-uddannede, herunder handelskøb, ejendomsforbehold, levering, risiko, mangler og reklamation." data-forudsætning-url="https://jura.tepedu.dk/kapitel3.html" data-forudsætning-text="Købeloven - Kapitel 3" data-forudsætning="">
     <header> <a href="index.html"
             target="_blank"><img src="tepedulogo.svg"
                    alt="Logo"
                    width="8%"></a>
          <h2>Quiz Købeloven - Vigtige Paragraffer</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Købeloven: Vigtige Paragraffer
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad handler KBL § 4 om?"
                                        data-answer="2"
                                        data-explanation="KBL § 4 handler om handelskøb. Det er definitionen af handelskøb: Et køb mellem to erhvervsdrivende, der handler i eller for deres bedrift. Særlige, skærpede regler gælder for handelskøb. Købeloven er deklaratorisk ved handelskøb, hvilket betyder, at den kan fraviges ved aftale.">
                                        <div class="option"
                                             data-option="Forbrugerkøb"></div>
                                        <div class="option"
                                             data-option="Ejendomsforbehold"></div>
                                        <div class="option"
                                             data-option="Handelskøb"></div>
                                        <div class="option"
                                             data-option="Mangler ved varen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 6 om?"
                                        data-answer="1"
                                        data-explanation="KBL § 6 handler om ejendomsforbehold. Sælger kan forbeholde sig ejendomsretten til varen, indtil købesummen er fuldt betalt. Dette giver sælgeren sikkerhed ved afbetalingskøb.">
                                        <div class="option"
                                             data-option="Leveringstidspunkt"></div>
                                        <div class="option"
                                             data-option="Ejendomsforbehold"></div>
                                        <div class="option"
                                             data-option="Risikoens overgang"></div>
                                        <div class="option" data-option="Reklamation, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 9 om?"
                                        data-answer="0"
                                        data-explanation="KBL § 9 handler om leveringstidspunkt. Hvis ikke andet er aftalt, skal levering ske inden rimelig tid. Hvad der er rimelig tid afhænger af varens karakter og branchestandarder.">
                                        <div class="option"
                                             data-option="Leveringstidspunkt"></div>
                                        <div class="option" data-option="Ejendomsforbehold"></div>
                                        <div class="option"
                                             data-option="Risikoens overgang"></div>
                                        <div class="option" data-option="Mangler ved varen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 13 om?"
                                        data-answer="2"
                                        data-explanation="KBL § 13 handler om risikoens overgang. Risikoen for varen overgår til køber ved levering. Hvis varen går i stykker eller ødelægges efter levering, er det køberens problem, selvom ejendomsretten måske ikke er overgået.">
                                        <div class="option"
                                             data-option="Leveringstidspunkt"></div>
                                        <div class="option" data-option="Ejendomsforbehold"></div>
                                        <div class="option"
                                             data-option="Risikoens overgang"></div>
                                        <div class="option" data-option="Reklamation, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 16 om?"
                                        data-answer="3"
                                        data-explanation="KBL § 16 handler om handelskøb og sædvane. Ved handelskøb må købeloven vige for handelsbrug eller sædvane. Dette betyder, at branchestandarder kan have forrang.">
                                        <div class="option" data-option="Ejendomsforbehold"></div>
                                        <div class="option" data-option="Mangler ved varen"></div>
                                        <div class="option" data-option="Reklamation, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Handelskøb - sædvane"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 17 om?"
                                        data-answer="1"
                                        data-explanation="KBL § 17 handler om mangler ved varen. Varen skal være i overensstemmelse med aftalen. En mangel foreligger, når varen afviger fra det, der er aftalt, ikke har de egenskaber, sælgeren har oplyst, eller ikke er egnet til det formål, den normalt bruges til.">
                                        <div class="option" data-option="Reklamation og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Mangler ved varen"></div>
                                        <div class="option"
                                             data-option="Afhjælpning og omlevering"></div>
                                        <div class="option"
                                             data-option="Forsinkelse ved levering"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 21 om?"
                                        data-answer="0"
                                        data-explanation="KBL § 21 handler om reklamation. Køber skal reklamere inden for rimelig tid efter, at en mangel er opdaget. Ved handelskøb er reklamationsfristen skærpet, og køberen skal reklamere hurtigere end ved civilkøb.">
                                        <div class="option"
                                             data-option="Reklamation"></div>
                                        <div class="option"
                                             data-option="Mangler ved varen"></div>
                                        <div class="option"
                                             data-option="Afhjælpning og omlevering"></div>
                                        <div class="option"
                                             data-option="Erstatning ved mangler"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 23 om?"
                                        data-answer="2"
                                        data-explanation="KBL § 23 handler om afhjælpning og omlevering. Sælger har ret til at afhjælpe en mangel eller levere en ny vare. Køber kan ikke umiddelbart kræve pengene tilbage. Køberen skal give sælgeren rimelig tid til at afhjælpe manglen.">
                                        <div class="option" data-option="Reklamation, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Mangler ved varen og skal overholdes"></div>
                                        <div class="option"
                                             data-option="Afhjælpning og omlevering"></div>
                                        <div class="option"
                                             data-option="Prisafslag eller ophævelse"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 24 om?"
                                        data-answer="3"
                                        data-explanation="KBL § 24 handler om prisafslag eller ophævelse. Hvis afhjælpning ikke sker inden rimelig tid, kan køber kræve prisafslag eller ophæve købet. Køberen kan også kræve erstatning for tab.">
                                        <div class="option" data-option="Afhjælpning og omlevering"></div>
                                        <div class="option" data-option="Reklamation, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Erstatning ved mangler"></div>
                                        <div class="option"
                                             data-option="Prisafslag eller ophævelse"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 27 om?"
                                        data-answer="1"
                                        data-explanation="KBL § 27 handler om erstatning ved mangler. Køber kan kræve erstatning for tab, der opstår som følge af mangler ved varen. Erstatningen omfatter både direkte skade og tabt fortjeneste.">
                                        <div class="option"
                                             data-option="Prisafslag eller ophævelse"></div>
                                        <div class="option"
                                             data-option="Erstatning ved mangler"></div>
                                        <div class="option"
                                             data-option="Forsinkelse ved levering"></div>
                                        <div class="option"
                                             data-option="Sælgers misligholdelse"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 28 om?"
                                        data-answer="2"
                                        data-explanation="KBL § 28 handler om forsinkelse ved levering. Hvis sælgeren ikke leverer rettidigt, kan køberen kræve opfyldelse eller ophæve købet. Køberen kan også kræve erstatning for tab ved forsinkelsen.">
                                        <div class="option" data-option="Erstatning ved mangler"></div>
                                        <div class="option" data-option="Sælgers misligholdelse"></div>
                                        <div class="option"
                                             data-option="Forsinkelse ved levering"></div>
                                        <div class="option" data-option="Købers misligholdelse"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad handler KBL § 32 om?"
                                        data-answer="0"
                                        data-explanation="KBL § 32 handler om handelskøb - særlige regler. Ved handelskøb gælder særlige, skærpede regler om reklamation og misligholdelse. Køberen skal reklamere hurtigere og har kortere frister end ved civilkøb.">
                                        <div class="option"
                                             data-option="Handelskøb - særlige regler"></div>
                                        <div class="option" data-option="Forsinkelse ved levering"></div>
                                        <div class="option" data-option="Betalingsbetingelser"></div>
                                        <div class="option"
                                             data-option="Reklamationsfrist ved handelskøb"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsforbehold ifølge KBL § 6?"
                                        data-answer="1"
                                        data-explanation="Ifølge KBL § 6 kan sælgeren forbeholde sig ejendomsretten til varen, indtil købesummen er fuldt betalt. Dette giver sælgeren sikkerhed ved afbetalingskøb. Eksempel: En finansieringsselskab sælger en bil på afbetaling og forbeholder sig ejendomsretten, indtil sidste afdrag er betalt.">
                                        <div class="option" data-option="At køberen beholder ejendomsretten, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="At sælgeren kan forbeholde sig ejendomsretten til varen, indtil købesummen er fuldt betalt"></div>
                                        <div class="option" data-option="At risikoen overgår til køberen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At levering skal ske inden rimelig tid, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår overgår risikoen for varen ifølge KBL § 13?"
                                        data-answer="3"
                                        data-explanation="Ifølge KBL § 13 overgår risikoen for varen til køber ved levering. Hvis varen går i stykker eller ødelægges efter levering, er det køberens problem, selvom ejendomsretten måske ikke er overgået.">
                                        <div class="option"
                                             data-option="Ved indgåelse af købsaftalen"></div>
                                        <div class="option"
                                             data-option="Ved betaling"></div>
                                        <div class="option"
                                             data-option="Ved ejendomsforbehold"></div>
                                        <div class="option"
                                             data-option="Ved levering"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er en mangel ifølge KBL § 17?"
                                        data-answer="0"
                                        data-explanation="Ifølge KBL § 17 skal varen være i overensstemmelse med aftalen. En mangel foreligger, når varen afviger fra det, der er aftalt, ikke har de egenskaber, sælgeren har oplyst, eller ikke er egnet til det formål, den normalt bruges til.">
                                        <div class="option"
                                             data-option="Når varen afviger fra det aftalte, ikke har de oplyste egenskaber, eller ikke er egnet til formålet"></div>
                                        <div class="option" data-option="Når prisen er for høj hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Når leveringstiden er for lang, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Når køberen ikke er tilfreds, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvornår skal køberen reklamere ifølge KBL § 21?"
                                        data-answer="2"
                                        data-explanation="Ifølge KBL § 21 skal køberen reklamere inden for rimelig tid efter, at en mangel er opdaget. Ved handelskøb er reklamationsfristen skærpet, og køberen skal reklamere hurtigere end ved civilkøb (typisk inden for 1-2 uger).">
                                        <div class="option" data-option="Inden for 1 år, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Inden for 6 måneder, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Inden for rimelig tid efter opdagelse af manglen"></div>
                                        <div class="option" data-option="Inden for 2 år, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er sælgerens ret ifølge KBL § 23?"
                                        data-answer="1"
                                        data-explanation="Ifølge KBL § 23 har sælgeren ret til at afhjælpe en mangel eller levere en ny vare. Køberen kan ikke umiddelbart kræve pengene tilbage. Køberen skal give sælgeren rimelig tid til at afhjælpe manglen.">
                                        <div class="option" data-option="At kræve betaling med det samme"></div>
                                        <div class="option"
                                             data-option="At afhjælpe manglen eller levere en ny vare"></div>
                                        <div class="option" data-option="At nægte at rette fejlen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At kræve erstatning fra køberen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad kan køberen kræve ifølge KBL § 24, hvis afhjælpning ikke sker?"
                                        data-answer="3"
                                        data-explanation="Ifølge KBL § 24 kan køberen kræve prisafslag eller ophæve købet, hvis afhjælpning ikke sker inden rimelig tid. Køberen kan også kræve erstatning for tab.">
                                        <div class="option" data-option="Kun prisafslag, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun ophævelse af købet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun erstatning, baseret på en vurdering af omstændighederne og den konkrete situation"></div>
                                        <div class="option"
                                             data-option="Prisafslag eller ophævelse af købet, samt erstatning"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad kan køberen kræve ifølge KBL § 27 ved mangler?"
                                        data-answer="0"
                                        data-explanation="Ifølge KBL § 27 kan køberen kræve erstatning for tab, der opstår som følge af mangler ved varen. Erstatningen omfatter både direkte skade og tabt fortjeneste.">
                                        <div class="option"
                                             data-option="Erstatning for tab (direkte skade og tabt fortjeneste)"></div>
                                        <div class="option" data-option="Kun direkte skade, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun tabt fortjeneste, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun omlevering og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad kan køberen gøre ved forsinkelse ved levering ifølge KBL § 28?"
                                        data-answer="2"
                                        data-explanation="Ifølge KBL § 28 kan køberen ved forsinkelse ved levering kræve opfyldelse eller ophæve købet. Køberen kan også kræve erstatning for tab ved forsinkelsen.">
                                        <div class="option" data-option="Kun kræve opfyldelse, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun ophæve købet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Kræve opfyldelse eller ophæve købet, samt erstatning"></div>
                                        <div class="option" data-option="Kun kræve erstatning, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er karakteristisk for handelskøb ifølge KBL § 32?"
                                        data-answer="1"
                                        data-explanation="Ifølge KBL § 32 gælder ved handelskøb særlige, skærpede regler om reklamation og misligholdelse. Køberen skal reklamere hurtigere og har kortere frister end ved civilkøb.">
                                        <div class="option" data-option="At der er færre regler end ved civilkøb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At der gælder skærpede regler om reklamation og misligholdelse"></div>
                                        <div class="option" data-option="At der er samme regler som ved civilkøb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At der kun gælder for store beløb, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>
                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
