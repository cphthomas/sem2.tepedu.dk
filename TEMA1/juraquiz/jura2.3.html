     <body data-formål="Forståelse af de stærke ugyldighedsgrunde i Aftaleloven, herunder voldelig tvang, falsk/forfalskning, forvanskning og umyndighed." data-forudsætning-url="https://jura.tepedu.dk/kapitel2.html" data-forudsætning-text="Aftaleloven - Kapitel 2" data-forudsætning="">

          <h2>Quiz Aftaleloven - Stærke Ugyldighedsgrunde</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Aftaleloven: Stærke Ugyldighedsgrunde
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er kendetegnende for stærke ugyldighedsgrunde?"
                                        data-answer="1"
                                        data-explanation="Stærke ugyldighedsgrunde er så alvorlige, at aftalen er ugyldig selv om modparten var i god tro. De beskytter fundamentale rettigheder og samfundets tillid til retshandler. Eksempler er voldelig tvang, falsk/forfalskning, forvanskning og umyndighed.">
                                        <div class="option" data-option="De kræver altid ond tro hos modparten, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="De virker selv mod godtroende - aftalen er altid ugyldig"></div>
                                        <div class="option" data-option="De kan kun anvendes af forbrugeren, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="De kræver skriftlig dokumentation, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er voldelig tvang efter AFTL § 28?"
                                        data-answer="2"
                                        data-explanation="Efter AFTL § 28 er en aftale fremkaldt ved vold eller trussel om øjeblikkelig vold ugyldig. Det er en stærk ugyldighedsgrund, der virker selv mod godtroende. Eksempler: Pistol for panden, kniv for halsen, trussel om at slå NU (ikke i fremtiden).">
                                        <div class="option" data-option="Trusler om at afsløre hemmeligheder"></div>
                                        <div class="option" data-option="Økonomisk afpresning, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Vold eller trussel om øjeblikkelig vold"></div>
                                        <div class="option" data-option="Psykisk påvirkning, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En kunde bliver tvunget til at hæve 200.000 kr. med en kniv for halsen. Banken vidste intet om tvangen. Hvad er konsekvensen?"
                                        data-answer="0"
                                        data-explanation="Efter AFTL § 28 er hævningen ugyldig pga. voldelig tvang, selvom banken var i god tro. Dette er en stærk ugyldighedsgrund. Kunden skal dog reklamere straks efter, at truslen er ophørt. Banken kan ikke holde kunden ansvarlig for beløbet.">
                                        <div class="option"
                                             data-option="Hævningen er ugyldig, selvom banken var i god tro"></div>
                                        <div class="option" data-option="Hævningen er gyldig, da banken var i god tro hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kunden skal betale halvdelen tilbage"></div>
                                        <div class="option" data-option="Banken kan kræve erstatning fra kunden"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem falsk og forfalskning?"
                                        data-answer="3"
                                        data-explanation="Falsk betyder, at dokumentet er falsk fra starten - underskriften er ikke ægte. Løftegiveren har aldrig afgivet nogen viljeserklæring. Forfalskning betyder, at dokumentet var ægte, men er blevet ændret efterfølgende uden løftegiverens viden (fx beløb ændret fra 250.000 kr. til 550.000 kr.).">
                                        <div class="option" data-option="Der er ingen forskel, det er det samme, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Falsk er kun for underskrifter, forfalskning er for beløb"></div>
                                        <div class="option" data-option="Falsk er lovligt, forfalskning er ulovligt, som er fastlagt gennem retspraksis og domstolenes fortolkning"></div>
                                        <div class="option"
                                             data-option="Falsk er fra starten, forfalskning er ændring af ægte dokument"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En svindler forfalsker sin fars underskrift på en kautionserklæring. Banken bevilger lånet i god tro. Hvad er konsekvensen?"
                                        data-explanation="Efter straffeloven er kautionen ugyldig, da underskriften er falsk. Faderen har aldrig afgivet nogen viljeserklæring. Dette er en stærk ugyldighedsgrund, der virker selv mod godtroende bank. Banken taber pengene, selvom de var i god tro. Sønnen straffes for dokumentfalsk og bedrageri."
                                        data-answer="1">
                                        <div class="option" data-option="Kautionen er gyldig, da banken var i god tro"></div>
                                        <div class="option"
                                             data-option="Kautionen er ugyldig, selvom banken var i god tro"></div>
                                        <div class="option" data-option="Faderen skal betale halvdelen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Banken kan kræve erstatning fra faderen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forvanskning efter AFTL § 32, stk. 2?"
                                        data-answer="2"
                                        data-explanation="Efter AFTL § 32, stk. 2 er forvanskning en fejl i transmission (IT-fejl, telegraf, SMS, email), der gør erklæringen ugyldig, hvis afsender reklamerer straks ('uden ugrundet ophold'). Dette er en stærk ugyldighedsgrund. Eksempel: IT-fejl ændrer renten i email fra 3% til 0,3%.">
                                        <div class="option" data-option="En bevidst løgn fra afsenderen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="En fejl i afsenderens beregning, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="En fejl i transmission (IT-fejl, SMS, email), hvis afsender reklamerer straks"></div>
                                        <div class="option" data-option="En fejl, der kræver ond tro hos modtageren, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Et pensionsselskab sender et tilbud med 84.429 kr./md. i stedet for 74.429 kr./md. pga. IT-fejl. Kunden accepterer. Selskabet opdager fejlen efter 2 uger. Hvad er konsekvensen?"
                                        data-answer="0"
                                        data-explanation="Efter AFTL § 32, stk. 2 er selskabet ikke bundet af de 84.429 kr./md., hvis de reklamerer straks (hvilket de gjorde efter 2 uger). Dette er forvanskning - en fejl i IT-systemet under fremsendelsen. Kunden kan dog have krav på erstatning for det tab, han lider ved at have indrettet sig.">
                                        <div class="option"
                                             data-option="Selskabet er ikke bundet, hvis de reklamerede straks"></div>
                                        <div class="option" data-option="Selskabet er bundet, da kunden accepterede hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kunden skal betale forskellen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Aftalen er ugyldig på grund af fejlen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvem er umyndige efter værgemålsloven?"
                                        data-answer="3"
                                        data-explanation="Umyndige er: 1) Mindreårige (under 18 år) - kan ikke stifte gæld eller indgå større aftaler uden forældres samtykke. 2) Personer under værgemål med fratagelse af handleevne (Værgemålsloven § 6). 3) Personer uden evne til at handle fornuftsmæssigt (Værgemålsloven § 46) - selv uden værgemål.">
                                        <div class="option" data-option="Kun personer under 16 år, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun personer under værgemål, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun personer med demens, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Mindreårige, personer under værgemål med fratagelse af handleevne, og personer uden evne til at handle fornuftsmæssigt"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En 17-årig får et billån på 300.000 kr. uden at vise ID. Banken var i god tro. Hvad er konsekvensen?"
                                        data-answer="1"
                                        data-explanation="Efter værgemålsloven er låneaftalen ugyldig, da personen var under 18 år ved aftalens indgåelse. Dette er en stærk ugyldighedsgrund, der virker selv mod godtroende bank. Banken kan ikke kræve pengene tilbage af den unge eller hans forældre. De kan dog kræve bilen tilbage (condictio indebiti).">
                                        <div class="option" data-option="Lånet er gyldigt, da banken var i god tro"></div>
                                        <div class="option"
                                             data-option="Lånet er ugyldig, selvom banken var i god tro"></div>
                                        <div class="option" data-option="Den unge skal betale halvdelen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Forældrene skal betale lånet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En 85-årig med fremskreden demens (tinglyst værgemål) tegner en livsforsikring til 500.000 kr. årligt i præmie. Hvad er konsekvensen?"
                                        data-answer="2"
                                        data-explanation="Efter Værgemålsloven § 6 er forsikringsaftalen ugyldig, da personen havde ikke handleevne. Værgemålet var tinglyst, så forsikringsselskabet kunne have tjekket det. Selskabet skal tilbagebetale de indbetalte præmier. Dørsælgeren kan straffes for at udnytte en umyndig person.">
                                        <div class="option" data-option="Forsikringen er gyldig, da den er tegnet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Forsikringen er gyldig, men præmien kan nedsættes"></div>
                                        <div class="option"
                                             data-option="Forsikringen er ugyldig, og selskabet skal tilbagebetale præmierne"></div>
                                        <div class="option" data-option="Værgen skal godkende forsikringen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem stærke og svage ugyldighedsgrunde?"
                                        data-answer="0"
                                        data-explanation="Stærke ugyldighedsgrunde virker selv mod godtroende - aftalen er altid ugyldig. Svage ugyldighedsgrunde kræver ond tro hos modparten - hvis modparten var i god tro, er aftalen gyldig. Eksempler på stærke: voldelig tvang, falsk, forvanskning, umyndighed. Eksempler på svage: svig, simpel tvang, udnyttelse, fejlskrift.">
                                        <div class="option"
                                             data-option="Stærke virker mod godtroende, svage kræver ond tro"></div>
                                        <div class="option"
                                             data-option="Stærke kræver skriftlig dokumentation, svage kræver ikke"></div>
                                        <div class="option"
                                             data-option="Stærke kan kun anvendes af forbrugeren, svage kan anvendes af alle"></div>
                                        <div class="option" data-option="Der er ingen forskel, de virker ens"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En person bliver overfaldet og tvunget til at oplyse PIN-koden og hæve 10.000 kr. Hvad er konsekvensen?"
                                        data-answer="3"
                                        data-explanation="Efter AFTL § 28 er hævningen ugyldig pga. voldelig tvang. Kortindehaveren hæfter IKKE for de 10.000 kr. Banken må selv bære tabet. Politianmeldelse er afgørende for at dokumentere tvangen. Dette er en stærk ugyldighedsgrund, der virker selv mod godtroende bank.">
                                        <div class="option"
                                             data-option="Kortindehaveren skal betale de 10.000 kr. tilbage"></div>
                                        <div class="option" data-option="Kortindehaveren skal betale halvdelen"></div>
                                        <div class="option" data-option="Banken og kortindehaveren deler tabet"></div>
                                        <div class="option"
                                             data-option="Kortindehaveren hæfter ikke, banken bærer tabet"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er kravet ved forvanskning efter AFTL § 32, stk. 2?"
                                        data-answer="1"
                                        data-explanation="Efter AFTL § 32, stk. 2 skal afsenderen reklamere 'uden ugrundet ophold' efter at have opdaget fejlen. Gør han ikke det, bliver han bundet af den forkerte erklæring. Dette er vigtigt - reklamationen skal ske straks, ellers er aftalen bindende.">
                                        <div class="option" data-option="Afsenderen skal reklamere inden for 30 dage"></div>
                                        <div class="option"
                                             data-option="Afsenderen skal reklamere 'uden ugrundet ophold'"></div>
                                        <div class="option" data-option="Modtageren skal acceptere reklamationen"></div>
                                        <div class="option" data-option="Reklamationen skal være skriftlig, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
