<body data-formål="Forståelse af ejendomsmæglerens pligter, ansvar og konsekvenser ved fejl." data-forudsætning-url="https://jura.tepedu.dk/kapitel7.html" data-forudsætning-text="Online-bog Jura Kapitel 7: Ejendomshandel, Tinglysning & Pant" data-forudsætning="">

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">

                                   <div>
                                        <h1>
                                             Jura: Ejendomsmæglerens Pligter og Ansvarlighed
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens oplysningspligt?"
                                        data-answer="2"
                                        data-explanation="Ejendomsmægler skal oplyse om kendte fejl og mangler i ejendommen. Ved brud kan der være erstatningsansvar og mulig nedsættelse af købesum. Eksempel: Ejendomsmægler ved, at huset har fugtskader i kælderen, men fortier det. Køber opdager fejlene efter køb → Mægleren hæfter for erstatning.">
                                        <div class="option" data-option="At oplyse om købers økonomi, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At oplyse om bankens vilkår, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At oplyse om kendte fejl og mangler i ejendommen"></div>
                                        <div class="option" data-option="At oplyse om sælgers personlige forhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen, hvis ejendomsmægler fortier skjulte fejl?"
                                        data-answer="1"
                                        data-explanation="Hvis ejendomsmægler fortier kendte fejl i ejendommen, kan der være erstatningsansvar. Erstatningsomfanget er reparationsomkostninger + tabt værdi. Eksempel: Mægler ved om skimmelsvamp, men fortier det. Køber skal reparere for 200.000 kr. → Mægleren hæfter for 200.000 kr. + eventuelt tabt værdi.">
                                        <div class="option" data-option="Ingen konsekvens, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Erstatningsansvar - reparationsomkostninger + tabt værdi"></div>
                                        <div class="option" data-option="Kun advarsel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun nedsættelse af købesum, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens pligt ved ejendomsbeskrivelse?"
                                        data-answer="0"
                                        data-explanation="Ejendomsbeskrivelsen skal være korrekt og fuldstændig. Ved fejlagtig beskrivelse er der erstatningsansvar. Eksempel: Ejendomsmægler skriver, at huset er 150 m², men det er faktisk kun 120 m² → Mægleren hæfter for forskellen i værdi.">
                                        <div class="option"
                                             data-option="Ejendomsbeskrivelsen skal være korrekt og fuldstændig"></div>
                                        <div class="option" data-option="Ejendomsbeskrivelsen kan være ufuldstændig hvilket er standard praksis"></div>
                                        <div class="option" data-option="Ejendomsbeskrivelsen er valgfri, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ejendomsbeskrivelsen skal kun være omtrentlig"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen ved fejlagtig kvadratmeterangivelse?"
                                        data-answer="3"
                                        data-explanation="Ved fejlagtig kvadratmeterangivelse kan der være erstatningsansvar for værdiforskel. Eksempel: Mægler skriver 150 m², men det er 120 m². Værdiforskel er 300.000 kr. → Mægleren hæfter for 300.000 kr.">
                                        <div class="option" data-option="Ingen konsekvens, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun advarsel, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun nedsættelse af købesum"></div>
                                        <div class="option"
                                             data-option="Erstatningsansvar for værdiforskel"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens tinglysningspligt?"
                                        data-answer="2"
                                        data-explanation="Ejendomsmægler skal sikre, at skødet tinglyses korrekt. Ved brud er købers ret ikke sikret mod sælgers kreditorer. Eksempel: Ejendomsmægler glemmer at tinglyse skødet. Sælger går konkurs → Køber kan miste ejendommen til sælgers kreditorer.">
                                        <div class="option" data-option="At tinglyse pantebreve, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At tinglyse lejekontrakter"></div>
                                        <div class="option"
                                             data-option="At sikre, at skødet tinglyses korrekt"></div>
                                        <div class="option" data-option="At tinglyse servitutter, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen ved manglende tinglysning af skøde?"
                                        data-answer="1"
                                        data-explanation="Ved manglende tinglysning af skødet er købers ret ikke sikret mod sælgers kreditorer. Ved konkurs kan køber miste ejendommen. Eksempel: Mægler glemmer tinglysning. Sælger går konkurs → Køber mister ejendommen til sælgers kreditorer. Mægleren hæfter for hele købesummen.">
                                        <div class="option" data-option="Ingen konsekvens, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Købers ret er ikke sikret - kan miste ejendommen ved konkurs, mægler hæfter for hele købesummen"></div>
                                        <div class="option" data-option="Kun advarsel, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                        <div class="option" data-option="Kun nedsættelse af købesum, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens pligt ved pantstillelse?"
                                        data-answer="0"
                                        data-explanation="Ejendomsmægler skal hjælpe med pantstillelse ved finansiering. Ved brud kan finansiering mislykkes. Eksempel: Ejendomsmægler glemmer at tinglyse pantebreve. Banken kan nægte at udbetale lånet, da sikkerheden ikke er stillet.">
                                        <div class="option"
                                             data-option="At hjælpe med pantstillelse ved finansiering"></div>
                                        <div class="option" data-option="At betale pantstillelsen hvilket er standard praksis"></div>
                                        <div class="option" data-option="At vurdere pantet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At godkende pantet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens pligt ved købsaftale?"
                                        data-answer="3"
                                        data-explanation="Ejendomsmægler skal udarbejde korrekt købsaftale med alle betingelser. Ved brud kan aftalen være ugyldig eller give uforudsete konsekvenser. Eksempel: Ejendomsmægler glemmer at inkludere betingelse om byggesag. Køber opdager byggesag efter køb → Mægleren kan hæfte for erstatning.">
                                        <div class="option" data-option="At godkende købsaftalen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At betale for købsaftalen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At vurdere købsaftalen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At udarbejde korrekt købsaftale med alle betingelser"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen ved fejl i købsaftale?"
                                        data-answer="2"
                                        data-explanation="Ved fejl i købsaftale kan der være tab ved uforudsete omkostninger. Eksempel: Mægler glemmer at inkludere betingelse om byggesag. Køber skal betale 50.000 kr. for byggesag → Mægleren hæfter for 50.000 kr.">
                                        <div class="option" data-option="Ingen konsekvens, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun advarsel og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Tab ved uforudsete omkostninger - mægler hæfter for erstatning"></div>
                                        <div class="option" data-option="Kun nedsættelse af købesum og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal ejendomsmægleren oplyse om ved skjulte fejl?"
                                        data-answer="1"
                                        data-explanation="Ejendomsmægler skal oplyse om kendte fejl som fugtskader, skimmelsvamp og strukturelle problemer. Ved fortielse kan der være erstatningsansvar. Eksempel: Sælger ved om fugtskader i kælderen, men fortier det. Køber opdager fejlene efter køb. Køber kan kræve erstatning for reparationsomkostninger.">
                                        <div class="option" data-option="Kun om synlige fejl, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Om kendte fejl som fugtskader, skimmelsvamp og strukturelle problemer"></div>
                                        <div class="option" data-option="Kun om nye fejl, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun om billige fejl, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal ejendomsmægleren oplyse om ved byggesag?"
                                        data-answer="0"
                                        data-explanation="Sælger skal oplyse om byggesag eller manglende byggetilladelse. Ejendomsmægleren skal sikre, at dette oplyses. Eksempel: Sælger har bygget tilbygning uden byggetilladelse. Køber opdager dette efter køb. Køber kan kræve erstatning for omkostninger ved at få byggetilladelse eller ophæve købet.">
                                        <div class="option"
                                             data-option="Om byggesag eller manglende byggetilladelse"></div>
                                        <div class="option" data-option="Kun om nye byggerier hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kun om store byggerier, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun om billige byggerier, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal ejendomsmægleren oplyse om ved miljøproblemer?"
                                        data-answer="3"
                                        data-explanation="Sælger skal oplyse om kendte miljøproblemer som jordforurening og asbest. Ejendomsmægleren skal sikre, at dette oplyses. Eksempel: Sælger ved om jordforurening på grunden, men fortier det. Køber opdager dette efter køb. Køber kan kræve erstatning for omkostninger ved sanering eller nedsættelse af købesummen.">
                                        <div class="option" data-option="Kun om synlige miljøproblemer, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun om store miljøproblemer, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun om billige miljøproblemer, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Om kendte miljøproblemer som jordforurening og asbest"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens pligt ved prioritetsordenen?"
                                        data-answer="2"
                                        data-explanation="Ejendomsmægler skal sikre korrekt prioritetsorden ved pantstillelse. Pantebreve skal tinglyses i korrekt rækkefølge. Eksempel: Mægleren skal sikre, at realkreditpantebrev tinglyses som 1. prioritet og bankpantebrev som 2. prioritet. Fejl i prioritetsordenen kan betyde, at banken mister sikkerhed ved tvangsauktion.">
                                        <div class="option" data-option="At betale for pantstillelsen, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At vurdere pantet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At sikre korrekt prioritetsorden ved pantstillelse"></div>
                                        <div class="option" data-option="At godkende pantet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen ved fejl i prioritetsordenen?"
                                        data-answer="1"
                                        data-explanation="Ved fejl i prioritetsordenen kan banken miste sikkerhed ved tvangsauktion. Eksempel: Bankpantebrev tinglyses først ved fejl → Banken får 1. prioritet i stedet for realkredit. Ved tvangsauktion får banken først dækning, selvom realkreditinstituttet skulle have haft 1. prioritet. Realkreditinstituttet kan kræve erstatning af mægleren.">
                                        <div class="option" data-option="Ingen konsekvens, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Banken kan miste sikkerhed ved tvangsauktion - kan give erstatningsansvar"></div>
                                        <div class="option" data-option="Kun advarsel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun nedsættelse af købesum, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens pligt ved lejekontrakter?"
                                        data-answer="0"
                                        data-explanation="Ejendomsmægler skal sikre korrekt tinglysning af lejekontrakter. Lejekontrakter kan tinglyses for at sikre lejers ret. Eksempel: Mægleren tinglyser lejekontrakt, så lejer er beskyttet ved ejendomskøb. Hvis lejekontrakten ikke tinglyses, kan ny ejer opsige lejer.">
                                        <div class="option"
                                             data-option="At sikre korrekt tinglysning af lejekontrakter"></div>
                                        <div class="option" data-option="At betale for lejekontrakten hvilket er standard praksis"></div>
                                        <div class="option" data-option="At vurdere lejekontrakten, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At godkende lejekontrakten, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens pligt ved ejendomsvurdering?"
                                        data-answer="3"
                                        data-explanation="Ejendomsmægler skal give korrekt vurdering af ejendommens værdi. Vurderingen skal være realistisk og baseret på faktiske forhold. Eksempel: Mægleren vurderer huset til 3 mio. kr., men det er faktisk kun værd 2,5 mio. kr. Køber betaler for meget → Mægleren kan hæfte for forskellen, hvis vurderingen var uagtsom.">
                                        <div class="option" data-option="At give høj vurdering, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At give lav vurdering og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At give omtrentlig vurdering og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="At give korrekt og realistisk vurdering baseret på faktiske forhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er konsekvensen ved fejlagtig ejendomsvurdering?"
                                        data-answer="2"
                                        data-explanation="Ved fejlagtig ejendomsvurdering kan der være erstatningsansvar for værdiforskel. Eksempel: Mægleren vurderer huset til 3 mio. kr., men det er faktisk kun værd 2,5 mio. kr. Køber betaler for meget → Mægleren kan hæfte for forskellen, hvis vurderingen var uagtsom.">
                                        <div class="option" data-option="Ingen konsekvens, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun advarsel, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Erstatningsansvar for værdiforskel, hvis vurderingen var uagtsom"></div>
                                        <div class="option" data-option="Kun nedsættelse af købesum, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ejendomsmæglerens pligt ved tinglysningsafgift?"
                                        data-answer="1"
                                        data-explanation="Ejendomsmægler skal beregne tinglysningsafgiften korrekt i salgsbudgettet. Tinglysningsafgiften er fast beløb (1.850 kr.) + 0,6% af købesummen. Eksempel: Ved bolighandel på 3 mio. kr.: 1.850 kr. + 18.000 kr. (0,6% af 3 mio.) = 19.850 kr.">
                                        <div class="option" data-option="At betale tinglysningsafgiften, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At beregne tinglysningsafgiften korrekt i salgsbudgettet"></div>
                                        <div class="option" data-option="At vurdere tinglysningsafgiften, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At godkende tinglysningsafgiften, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er det samlede erstatningsomfang, hvis mægleren begår flere fejl?"
                                        data-answer="0"
                                        data-explanation="Hvis mægleren begår flere fejl, kan der være erstatningsansvar for alle fejlene samlet. Eksempel: Mægleren begår fejl i ejendomsbeskrivelse (300.000 kr.), manglende tinglysning (hele købesummen) og fejl i købsaftale (50.000 kr.) → Mægleren hæfter for alle fejlene samlet.">
                                        <div class="option"
                                             data-option="Erstatningsansvar for alle fejlene samlet"></div>
                                        <div class="option" data-option="Kun for den største fejl hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kun for den mindste fejl, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ingen erstatning, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                   </div>
                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
