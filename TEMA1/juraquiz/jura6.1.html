<body data-formål="Forståelse af Compliance og Hvidvaskloven, herunder grundbegreber, de 5 hovedpligter, hvidvaskens 3 faser og praktiske cases." data-forudsætning-url="https://jura.tepedu.dk/kapitel6.html" data-forudsætning-text="Online-bog Jura Kapitel 6: Compliance, Hvidvask og GDPR" data-forudsætning="">

             target="_blank"><img src="tepedulogo.svg"
                    alt="Logo"
                    width="8%"></a>
          <h2>Quiz Jura</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">

                              <div id="postProgressContent"
                                   class="mt-4"
                                   style="color: rgb(255, 255, 255);">
                                   <div>
                                        <h1>
                                             Jura: Compliance og Hvidvaskloven
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad betyder Compliance?"
                                        data-answer="1"
                                        data-explanation="Compliance betyder at overholde ('to comply with') love, regler og interne retningslinjer. Det sikrer virksomhedens integritet og undgår sanktioner.">
                                        <div class="option" data-option="At overholde love, regler og interne retningslinjer"></div>
                                        <div class="option"
                                             data-option="At overholde ('to comply with') love, regler og interne retningslinjer"></div>
                                        <div class="option" data-option="At undgå at betale skat, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At følge kundens ønsker uanset regler, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad står AML for?"
                                        data-answer="1"
                                        data-explanation="AML står for Anti-Money Laundering (Hvidvask). Det er regler for at forhindre kriminelle i at 'vaske' sorte penge hvide. Det forhindrer terrorfinansiering og organiseret kriminalitet.">
                                        <div class="option"
                                             data-option="Anti-Market Laundering"></div>
                                        <div class="option"
                                             data-option="Anti-Money Laundering"></div>
                                        <div class="option"
                                             data-option="Anti-Money Legislation"></div>
                                        <div class="option" data-option="Anti-Money Liability"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad betyder KYC?"
                                        data-answer="0"
                                        data-explanation="KYC står for 'Know Your Customer'. Det er pligten til at vide, hvem kunden er, og hvor pengene kommer fra. Det er en forudsætning for at kunne spotte mistænkelig adfærd.">
                                        <div class="option"
                                             data-option="Know Your Customer"></div>
                                        <div class="option"
                                             data-option="Know Your Compliance"></div>
                                        <div class="option" data-option="Keep Your Cash"></div>
                                        <div class="option" data-option="Know Your Company"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilken af følgende er IKKE en af de 5 hovedpligter i Hvidvaskloven?"
                                        data-answer="3"
                                        data-explanation="De 5 hovedpligter er: 1) Risikovurdering, 2) Kundekendskab (KYC), 3) Undersøgelsespligt, 4) Underretningspligt, 5) Opbevaringspligt. 'Kundetilfredshed' er ikke en pligt i Hvidvaskloven.">
                                        <div class="option" data-option="Risikovurdering og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="Kundekendskab (KYC)"></div>
                                        <div class="option"
                                             data-option="Undersøgelsespligt"></div>
                                        <div class="option"
                                             data-option="Kundetilfredshed"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er de 3 faser i hvidvaskprocessen?"
                                        data-answer="0"
                                        data-explanation="De 3 faser i hvidvask er: 1) Placering - sorte kontanter sættes ind i det finansielle system (fx via 'Smurfing' - mange små beløb), 2) Sløring (Layering) - pengene flyttes rundt mellem konti og lande, 3) Integration - pengene investeres i legale aktiver.">
                                        <div class="option"
                                             data-option="Placering, Sløring (Layering), Integration"></div>
                                        <div class="option" data-option="Undersøgelse, Underretning, Opbevaring hvilket er standard praksis"></div>
                                        <div class="option" data-option="KYC, Risikovurdering, Dokumentation"></div>
                                        <div class="option" data-option="Indbetaling, Overførsel, Investering"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'Smurfing' eller 'Structuring' i hvidvask-sammenhæng?"
                                        data-answer="2"
                                        data-explanation="Smurfing/Structuring er en teknik i hvidvask hvor man bevidst deler store beløb op i mange små beløb for at undgå at skulle vise ID eller forklare sig. Det er en del af placering-fasen.">
                                        <div class="option" data-option="At vaske penge gennem en pizzeria, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At investere i legale aktiver og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At bevidst dele store beløb op i mange små beløb for at undgå opdagelse"></div>
                                        <div class="option" data-option="At flytte penge mellem lande og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvor længe skal dokumentation fra hvidvaskloven gemmes?"
                                        data-answer="3"
                                        data-explanation="Dokumentation skal gemmes i 5 år efter kundeforholdets ophør. Dette inkluderer kopi af pas, kørekort og transaktionsspor.">
                                        <div class="option"
                                             data-option="1 år"></div>
                                        <div class="option"
                                             data-option="3 år"></div>
                                        <div class="option"
                                             data-option="10 år"></div>
                                        <div class="option"
                                             data-option="5 år"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal du gøre ved mistanke om hvidvask?"
                                        data-answer="0"
                                        data-explanation="Ved mistanke om hvidvask skal du gå til din hvidvaskansvarlige (Money Laundering Reporting Officer), som derefter underretter Hvidvasksekretariatet (NSK). Du må IKKE sige det til kunden (Meddelelsesforbud).">
                                        <div class="option"
                                             data-option="Gå til din hvidvaskansvarlige (Money Laundering Reporting Officer)"></div>
                                        <div class="option" data-option="Advare kunden med det samme, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Ignorere det hvis beløbet er lille, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Vente og se om det sker igen, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'Meddelelsesforbud' i Hvidvaskloven?"
                                        data-answer="2"
                                        data-explanation="Meddelelsesforbud betyder at du må IKKE sige til kunden, at du har underrettet Hvidvasksekretariatet. Dette er vigtigt for at undgå at kunden kan skjule beviser eller stoppe hvidvaskaktiviteten.">
                                        <div class="option" data-option="At du skal meddele kunden altid og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="At du må meddele kunden efter 30 dage"></div>
                                        <div class="option"
                                             data-option="At du må IKKE sige det til kunden"></div>
                                        <div class="option"
                                             data-option="At du skal meddele politiet først"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er en PEP'er i hvidvask-sammenhæng?"
                                        data-answer="2"
                                        data-explanation="PEP står for Politically Exposed Person (politisk eksponeret person). PEP'er er høj-risiko kunder i hvidvask-sammenhæng, da de har større risiko for korruption og hvidvask.">
                                        <div class="option" data-option="En person der er eksponeret for sol"></div>
                                        <div class="option" data-option="En person med høj indkomst, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="En politisk eksponeret person (høj-risiko kunde)"></div>
                                        <div class="option" data-option="En person der er eksponeret for risiko"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En kunde vil købe et hus kontant for 3 mio. kr. uden om banken. Hvad skal du gøre som ejendomsmægler?"
                                        data-answer="2"
                                        data-explanation="Kontantforbuddet og Hvidvaskloven gælder. Det er højest mistænkeligt. Mæglere må ikke modtage store kontantbeløb. Du skal afvise at modtage pengene kontant, undersøge sagen og sandsynligvis underrette Hvidvasksekretariatet.">
                                        <div class="option" data-option="Modtage pengene kontant, da kunden har ret til at betale kontant"></div>
                                        <div class="option" data-option="Modtage pengene, men underrette banken, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Afvise at modtage pengene kontant og underrette Hvidvasksekretariatet"></div>
                                        <div class="option" data-option="Modtage pengene, men kun hvis kunden viser ID, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="En pizzeria-ejer indsætter 9.500 kr. kontant hver dag i 14 dage. Hvorfor er dette mistænkeligt?"
                                        data-answer="1"
                                        data-explanation="Dette er 'Structuring' eller 'Smurfing'. Kunden forsøger bevidst at holde sig under grænsen på ca. 15.000 kr. (hvor man skal vise ID/forklare sig). Mønsteret tyder på forsøg på at 'vaske' sorte penge ind i systemet.">
                                        <div class="option" data-option="Fordi beløbet er for stort, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Fordi det er structuring/smurfing - bevidst at holde sig under grænsen"></div>
                                        <div class="option" data-option="Fordi det er kontant, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Fordi det er en pizzeria og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Som revisor opdager du mange kontante indbetalinger uden dokumentation. Kunden forklarer: 'Det er bare kontantbetalinger fra kunderne.' Hvad skal du gøre?"
                                        data-answer="3"
                                        data-explanation="Store kontantbeløb uden kvitteringer eller fakturaer er mistænkeligt. Det kan være hvidvask eller skattesvig. Du skal: 1) Kræve dokumentation (kvitteringer, fakturaer eller bankudtog), 2) Vurdere om kunden er høj-risiko (fx PEP'er, offshore-selskaber), 3) Hvis du har 'grundet mistanke', skal du underrette Hvidvasksekretariatet. Du må IKKE advare kunden (meddelelsesforbud).">
                                        <div class="option" data-option="Acceptere forklaringen og fortsætte, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun kræve dokumentation, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Advare kunden om at det er mistænkeligt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Kræve dokumentation, vurdere risiko, og underrette hvis mistanke"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'grundet mistanke' i Hvidvaskloven?"
                                        data-answer="0"
                                        data-explanation="'Grundet mistanke' betyder at du har objektive grunde til at mistænke hvidvask. Det er ikke nok med en følelse - der skal være konkrete tegn som manglende dokumentation, mistænkelige mønstre, eller høj-risiko kunder. Ved grundet mistanke skal du underrette Hvidvasksekretariatet.">
                                        <div class="option"
                                             data-option="Objektive grunde til at mistænke hvidvask"></div>
                                        <div class="option" data-option="En følelse af at noget er forkert hvilket er standard praksis"></div>
                                        <div class="option" data-option="Kun hvis politiet har sagt det"></div>
                                        <div class="option" data-option="Kun hvis beløbet er over 100.000 kr."></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilken type kunde er typisk høj-risiko i hvidvask-sammenhæng?"
                                        data-answer="3"
                                        data-explanation="Høj-risiko kunder inkluderer PEP'er (politisk eksponerede personer), offshore-selskaber, kunder fra høj-risiko lande, og kunder med komplekse ejerstrukturer. Disse skal have ekstra due diligence.">
                                        <div class="option" data-option="Alle kunder med høj indkomst, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun virksomheder og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun private personer og kan anvendes i forskellige sammenhænge"></div>
                                        <div class="option"
                                             data-option="PEP'er, offshore-selskaber og kunder fra høj-risiko lande"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'due diligence' i hvidvask-sammenhæng?"
                                        data-answer="2"
                                        data-explanation="Due diligence betyder grundig undersøgelse af kunden. Det inkluderer at undersøge ejerstruktur, formål, pengenes oprindelse, og om kunden er høj-risiko. Det er en del af KYC-processen.">
                                        <div class="option" data-option="At være forsigtig med kunden, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At kræve dokumentation og skal overholdes, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Grundig undersøgelse af kunden (ejerstruktur, formål, pengenes oprindelse)"></div>
                                        <div class="option" data-option="At underrette Hvidvasksekretariatet og kan anvendes i forskellige sammenhænge"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal du gøre hvis en kunde pludselig indsætter 100.000 kr. kontant?"
                                        data-answer="1"
                                        data-explanation="Ved store kontantbeløb skal du spørge: 'Hvor kommer pengene fra?' og kræve dokumentation. Dette er en del af undersøgelsespligten. Hvis svaret er svævende eller mistænkeligt, skal du underrette Hvidvasksekretariatet.">
                                        <div class="option" data-option="Acceptere det uden spørgsmål, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Spørge om pengenes oprindelse og kræve dokumentation"></div>
                                        <div class="option" data-option="Kun registrere det i systemet, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Advare kunden om at det er mistænkeligt"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er den typiske grænse hvor man skal vise ID eller forklare sig ved kontantindbetalinger?"
                                        data-answer="2"
                                        data-explanation="Den typiske grænse er omkring 15.000 kr. Ved beløb over denne grænse skal man vise ID og forklare pengenes oprindelse. Derfor forsøger hvidvaskere at holde sig under denne grænse gennem structuring/smurfing.">
                                        <div class="option" data-option="5.000 kr., hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="10.000 kr."></div>
                                        <div class="option"
                                             data-option="Ca. 15.000 kr."></div>
                                        <div class="option" data-option="50.000 kr."></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad skal du indhente ved KYC (Kundekendskab)?"
                                        data-answer="1"
                                        data-explanation="Ved KYC skal du indhente legitimation (Pas/Kørekort + Sundhedskort). For virksomheder skal du tjekke reelle ejere i CVR. Du skal også spørge til pengenes oprindelse.">
                                        <div class="option" data-option="Kun pas, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Legitimation (Pas/Kørekort + Sundhedskort)"></div>
                                        <div class="option" data-option="Kun kørekort, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun CPR-nummer, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                              </div>
                         </div>
                    </div>
                </div>
            </div>
        </div>
