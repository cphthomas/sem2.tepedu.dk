<body data-formål="Forståelse af gældsbreve (omsætningsgældsbreve vs. simple gældsbreve), sikringsakter og kaution." data-forudsætning-url="https://jura.tepedu.dk/kapitel5.html" data-forudsætning-text="Online-bog Jura Kapitel 5: Kreditaftale, Kaution & Gældsbreve" data-forudsætning="">

                                   <div>
                                        <h1>
                                             Jura: Gældsbreve og Kaution
                                        </h1>
                                   </div>
                              </div>

                              <h1 id="question"
                                  class="card-title"></h1>
                              <div id="options"
                                   class="mt-4"></div>
                              <div id="progress-bar"
                                   class="progress-bar-container"></div>

                            <div id="quiz-data" style="display: none;">
                                
                                   <div class="question"
                                        data-question="Hvad er et gældsbrev?"
                                        data-answer="2"
                                        data-explanation="Et gældsbrev er et skriftligt dokument, der beviser gælden. Det skal være: 1) Skriftligt, 2) Ensidigt (kun debitor skriver under), og 3) Ubetinget (løftet om at betale må ikke være afhængigt af noget andet).">
                                        <div class="option" data-option="En købekontrakt, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="En aftale mellem to parter, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Et skriftligt dokument, der beviser gælden - skal være skriftligt, ensidigt og ubetinget"></div>
                                        <div class="option" data-option="Kun et banklån, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem omsætningsgældsbreve og simple gældsbreve?"
                                        data-answer="0"
                                        data-explanation="Omsætningsgældsbreve er beregnet til at blive solgt (omsat) og giver køberen særlig beskyttelse gennem ekstinktion. Simple gældsbreve er ikke primært beregnet til videresalg, og køberen får ingen særlig beskyttelse - 'ingen ret bedre end overdrageren'.">
                                        <div class="option"
                                             data-option="Omsætningsgældsbreve: Beregnet til videresalg, giver køberen beskyttelse. Simple gældsbreve: Ikke beregnet til videresalg, køberen får ingen beskyttelse"></div>
                                        <div class="option" data-option="Der er ingen forskel - det er det samme hvilket er standard praksis, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Omsætningsgældsbreve er billigere, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Simple gældsbreve er bedre, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er sikringsakten for simple gældsbreve ifølge GBL § 31?"
                                        data-answer="3"
                                        data-explanation="For simple gældsbreve er sikringsakten Denunciation (meddelelse). Køberen skal give debitor besked om overdragelsen. Eksempel: Banken køber fakturaer og skal straks sende brev til kunderne om, at de nu skal betale til banken.">
                                        <div class="option" data-option="Rådighedsberøvelse (fysisk besiddelse), baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun at købe gældsbrevet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun at underskrive, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Denunciation (meddelelse) - køberen skal give debitor besked om overdragelsen"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er sikringsakten for omsætningsgældsbreve ifølge GBL § 22?"
                                        data-answer="1"
                                        data-explanation="For omsætningsgældsbreve er sikringsakten Rådighedsberøvelse (fysisk besiddelse). Køberen skal have gældsbrevet fysisk i hånden. Eksempel: Sælger sælger pantebrev til kursinvestor. Investoren skal have pantebrevet fysisk.">
                                        <div class="option" data-option="Denunciation (meddelelse), baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Rådighedsberøvelse (fysisk besiddelse) - køberen skal have gældsbrevet fysisk i hånden"></div>
                                        <div class="option" data-option="Kun at købe gældsbrevet, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun at underskrive, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er ekstinktion?"
                                        data-answer="2"
                                        data-explanation="Ekstinktion betyder, at en godtroende køber kan 'udslette' (ekstingvere) svage indsigelser ved omsætningsgældsbreve. Dette betyder, at køberen kan kræve betaling, selvom debitor har indsigelser mod den oprindelige kreditor. Stærke indsigelser (fx falsk underskrift) kan ALDRIG ekstingveres.">
                                        <div class="option" data-option="At gældsbrevet bliver ugyldigt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="At køberen mister retten, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At godtroende køber kan 'udslette' svage indsigelser ved omsætningsgældsbreve - stærke indsigelser kan ALDRIG ekstingveres"></div>
                                        <div class="option" data-option="At debitor mister retten, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilke indsigelser kan ekstingveres ved omsætningsgældsbreve?"
                                        data-answer="0"
                                        data-explanation="Ved omsætningsgældsbreve kan godtroende køber ekstingvere svage indsigelser (fx mangler i varen, for sent levering). Stærke indsigelser (fx falsk underskrift, voldelig tvang) kan ALDRIG ekstingveres.">
                                        <div class="option"
                                             data-option="Svag indsigelse (fx mangler i varen) - hvis køberen er i god tro. Stærke indsigelser (fx falsk underskrift) kan ALDRIG ekstingveres"></div>
                                        <div class="option" data-option="Alle indsigelser kan ekstingveres hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun stærke indsigelser, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ingen indsigelser kan ekstingveres, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem debitors indsigelser ved simple og omsætningsgældsbreve?"
                                        data-answer="3"
                                        data-explanation="Ved simple gældsbreve bevarer debitor ALLE sine indsigelser mod køberen. Ingen ekstinktion mulig. Ved omsætningsgældsbreve kan godtroende køber ekstingvere svage indsigelser, men ikke stærke indsigelser.">
                                        <div class="option" data-option="Der er ingen forskel, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Ved simple gældsbreve kan alle indsigelser ekstingveres, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Ved omsætningsgældsbreve bevarer debitor alle indsigelser, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Ved simple gældsbreve bevarer debitor ALLE indsigelser. Ved omsætningsgældsbreve kan svage indsigelser ekstingveres"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilke af følgende er eksempler på omsætningsgældsbreve?"
                                        data-answer="1"
                                        data-explanation="Eksempler på omsætningsgældsbreve er: 1) Ihændehavergældsbreve ('Betales til ihændehaveren'), 2) Ordregældsbreve ('Betales til [Navn] eller ordre'), og 3) Pantebreve i fast ejendom (som udgangspunkt).">
                                        <div class="option" data-option="Kun fakturaer, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="Ihændehavergældsbreve, ordregældsbreve og pantebreve i fast ejendom (som udgangspunkt)"></div>
                                        <div class="option" data-option="Kun navnegældsbreve, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun almindelige fakturaer, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvilke af følgende er eksempler på simple gældsbreve?"
                                        data-answer="2"
                                        data-explanation="Eksempler på simple gældsbreve er: 1) Navnegældsbreve ('Betales til [Navn]' - uden 'eller ordre'), 2) Almindelige fakturaer, og 3) Låneaftaler i banken (ofte simple).">
                                        <div class="option" data-option="Kun pantebreve, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun ihændehavergældsbreve, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Navnegældsbreve, almindelige fakturaer og låneaftaler i banken (ofte)"></div>
                                        <div class="option" data-option="Kun ordregældsbreve, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er kaution?"
                                        data-answer="0"
                                        data-explanation="Kaution betyder, at en tredjeperson (kautionisten) lover at betale gælden, hvis hovedskyldneren (debitor) ikke selv kan betale. Kaution er en vigtig sikkerhedsform i finanssektoren, især ved erhvervslån og boliglån.">
                                        <div class="option"
                                             data-option="At en tredjeperson (kautionisten) lover at betale gælden, hvis hovedskyldneren ikke selv kan betale"></div>
                                        <div class="option" data-option="At debitor betaler gælden selv hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="At banken betaler gælden, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="At gælden bliver annulleret, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem selvskyldnerkaution og simpel kaution?"
                                        data-answer="3"
                                        data-explanation="Selvskyldnerkaution: Kreditor kan kræve pengene af kautionisten straks debitor har misligholdt. Dette er standard i bankforhold. Simpel kaution: Kreditor skal først bevise, at debitor ikke kan betale (fx ved forgæves udlæg), før kautionisten kan kræves. Sjældent i bankforhold.">
                                        <div class="option" data-option="Der er ingen forskel - det er det samme, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Simpel kaution er bedre, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun selvskyldnerkaution er gyldig, hvilket kræver dokumentation af de faktiske omstændigheder og årsagssammenhæng"></div>
                                        <div class="option"
                                             data-option="Selvskyldnerkaution: Kreditor kan kræve pengene straks ved misligholdelse. Simpel kaution: Kreditor skal først bevise, at debitor ikke kan betale"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er bankens oplysningspligt ved kaution ifølge Lov om finansiel virksomhed § 48?"
                                        data-answer="1"
                                        data-explanation="Banken skal oplyse kautionisten om debitors økonomi, gæld, indtægt og risikoen før kautionen indgås. Hvis banken ikke gør det, kan kautionen være ugyldig.">
                                        <div class="option" data-option="Kun at oplyse kautionistens navn, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option"
                                             data-option="At oplyse kautionisten om debitors økonomi, gæld, indtægt og risikoen - ellers kan kautionen være ugyldig"></div>
                                        <div class="option" data-option="Kun at oplyse debitors navn, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Ingen oplysningspligt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er beløbsbegrænsning ved kaution ifølge Lov om finansiel virksomhed § 48?"
                                        data-answer="2"
                                        data-explanation="Kautionen skal være begrænset til et fast beløb eller en del af gælden. En ubegrænset kaution ('jeg kautionerer for alt') kan være ugyldig. Eksempel: Kautionen skal være begrænset til fx 500.000 kr. eller 50% af gælden.">
                                        <div class="option" data-option="Kautionen skal være ubegrænset, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Kautionen skal være mindst 1 mio. kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Kautionen skal være begrænset til et fast beløb eller en del af gælden - ubegrænset kaution kan være ugyldig"></div>
                                        <div class="option" data-option="Ingen begrænsning nødvendig, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er bankens underretningspligt ved kaution ifølge Lov om finansiel virksomhed § 48?"
                                        data-answer="0"
                                        data-explanation="Banken skal give kautionisten besked, hvis debitor misligholder lånet (senest efter 6 måneder). Hvis banken glemmer det, mister banken sit krav over for kautionisten for den del af gælden, der er misligholdt.">
                                        <div class="option"
                                             data-option="Banken skal give kautionisten besked ved misligholdelse (senest efter 6 måneder) - ellers mister banken sit krav"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 1 mio. kr. hvilket er standard praksis, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hvis kautionisten beder om det, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Ingen underretningspligt, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis banken glemmer at underrette kautionisten om misligholdelse inden 6 måneder, hvad er konsekvensen?"
                                        data-answer="3"
                                        data-explanation="Hvis banken glemmer at underrette kautionisten om misligholdelse inden 6 måneder, mister banken sit krav over for kautionisten for den del af gælden, der er misligholdt. Kautionisten kan kræve kautionen bortfaldet.">
                                        <div class="option" data-option="Ingen konsekvens, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun et lille gebyr, baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option" data-option="Kun hvis lånet er over 1 mio. kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                        <div class="option"
                                             data-option="Banken mister sit krav over for kautionisten for den del af gælden, der er misligholdt"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er factoring?"
                                        data-answer="1"
                                        data-explanation="Factoring er, når en virksomhed sælger sine fakturaer (simple gældsbreve) til en bank eller factoringvirksomhed. Banken skal give kunderne besked om overdragelsen (Denunciation). Dette er meget brugt i finanssektoren.">
                                        <div class="option" data-option="At banken låner penge til virksomhed, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="At en virksomhed sælger sine fakturaer (simple gældsbreve) til en bank - banken skal give kunderne besked (Denunciation)"></div>
                                        <div class="option" data-option="At virksomheden betaler sine fakturaer, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                        <div class="option" data-option="At banken køber virksomheden, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvis banken køber fakturaer, men glemmer at give kunderne besked om overdragelsen, hvad sker der?"
                                        data-answer="2"
                                        data-explanation="Hvis banken ikke udfører Denunciation (giver kunderne besked), kan kunderne betale til virksomheden med frigørende virkning. Banken kan ikke kræve pengene af kunderne. Banken må kræve pengene af virksomheden i stedet.">
                                        <div class="option" data-option="Ingen konsekvens, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option" data-option="Kun et lille gebyr, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                        <div class="option"
                                             data-option="Kunderne kan betale til virksomheden med frigørende virkning - banken kan ikke kræve pengene af kunderne"></div>
                                        <div class="option" data-option="Kun hvis fakturaerne er over 100.000 kr., baseret på en gennemgang af relevante dokumenter og bevisforhold"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er 'efterfølgende trepartsforhold'?"
                                        data-answer="0"
                                        data-explanation="Efterfølgende trepartsforhold er når sælgeren sælger fordringen (gældsbrevet) til en tredjeperson efter købsaftalen er indgået. Dette reguleres af gældsbrevsloven. Eksempel: Køber køber bil på kredit hos bilforhandler. Bilforhandleren sælger senere fordringen til factoringbank.">
                                        <div class="option"
                                             data-option="Når sælgeren sælger fordringen til tredjeperson efter købsaftalen er indgået - reguleres af gældsbrevsloven"></div>
                                        <div class="option" data-option="Når kreditgiver og sælger er forskellige personer, men kreditaftalen indgås samtidig med købsaftalen hvilket er standard praksis"></div>
                                        <div class="option" data-option="Når tre personer låner penge sammen, som skal vurderes ud fra de konkrete omstændigheder og gældende retspraksis"></div>
                                        <div class="option" data-option="Kun ved banklån, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
                                   </div>

                                   <div class="question"
                                        data-question="Hvad er forskellen mellem oprindeligt og efterfølgende trepartsforhold?"
                                        data-answer="3"
                                        data-explanation="Oprindeligt trepartsforhold: Kreditgiver og sælger er forskellige personer, men kreditaftalen indgås samtidig med købsaftalen. Reguleres af KAL § 4, nr. 15, litra b. Efterfølgende trepartsforhold: Sælgeren sælger fordringen til tredjeperson efter købsaftalen er indgået. Reguleres af gældsbrevsloven.">
                                        <div class="option" data-option="Der er ingen forskel - det er det samme, hvilket indebærer en analyse af de faktiske forhold og relevante lovbestemmelser"></div>
                                        <div class="option" data-option="Oprindeligt er bedre, hvilket kræver en konkret vurdering af de faktiske omstændigheder i den enkelte sag"></div>
